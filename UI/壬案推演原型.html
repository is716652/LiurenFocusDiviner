<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壬案推演原型 · 一局多占版</title>
<style>
:root{--bg:#14120F;--panel:#1C1A16;--panel2:#24211A;--paper:#F5EFE2;--ink:#E6DFD0;--gold:#F0D98C;--gold-d:#A8843C;--dim:#8A7B5C;--line:rgba(233,200,120,.18);--cinnabar:#A63A2B;--navy:#2F4A5F;--green:#3F7A70;--risk:#7A2E2E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(circle at 50% 0%,#1d1913,var(--bg));color:var(--ink);font-family:"HarmonyOS Sans","Microsoft YaHei",sans-serif;line-height:1.7;}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
header{padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;}
h1{color:var(--gold);font-size:28px;letter-spacing:5px;}
.sub{color:var(--dim);font-size:13px;margin-top:4px;}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--gold-d);font-size:12px;}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;} @media(max-width:920px){.grid{grid-template-columns:1fr;}}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);}
.card.paper{background:linear-gradient(160deg,#F7F1E0,#EFE3C8);color:#2B241B;border-color:rgba(166,58,43,.25);}
.card h2{color:var(--gold);font-size:18px;margin-bottom:8px;letter-spacing:2px;} .card.paper h2{color:var(--cinnabar);}
.muted{color:var(--dim);font-size:12px;} .paper .muted{color:#6A5F4B;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;} .chip{border:1px solid var(--line);background:#211E18;color:#C4B183;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;} .chip.on{background:#E9C878;color:#1A1410;font-weight:700;}
.group{color:var(--gold-d);font-size:12px;margin:12px 0 6px;letter-spacing:1px;}
.case-item{border:1px solid var(--line);background:#1C1A16;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;} .case-item:hover{border-color:rgba(233,200,120,.45);} .case-item.on{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);} .case-item b{display:block;color:#F0E6C8;font-size:14px;} .case-item small{color:var(--dim);display:block;margin-top:3px;}
.layout{display:grid;grid-template-columns:1.02fr .98fr;gap:16px;align-items:start;} @media(max-width:1100px){.layout{grid-template-columns:1fr;}}
.brief{background:rgba(240,217,140,.08);border-left:3px solid var(--gold-d);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.9;}
.btn{background:linear-gradient(135deg,#8a6a1e,var(--gold-d));border:none;color:#14100A;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;letter-spacing:1px;} .btn.ghost{background:#211E18;color:#C4B183;border:1px solid var(--line);} .btn:disabled{opacity:.4;cursor:not-allowed;} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.clue-list{margin-top:12px;display:grid;gap:8px;} .clue{border:1px solid var(--line);background:#211E18;border-radius:12px;padding:10px;color:#C4B183;font-size:13px;} .clue small{display:block;color:var(--dim);margin-top:3px;} .clue.found{border-color:rgba(63,122,112,.7);color:#DFF3EA;background:rgba(63,122,112,.14);} .clue.next{border-color:rgba(240,217,140,.45);}
.log{margin-top:12px;display:grid;gap:8px;max-height:200px;overflow:auto;} .logline{border-radius:10px;padding:9px 10px;font-size:13px;background:rgba(240,217,140,.07);color:#E6DFD0;border:1px solid rgba(233,200,120,.12);} .logline.bad{background:rgba(122,46,46,.12);border-color:rgba(122,46,46,.28);color:#E7C9C4;} .logline.good{background:rgba(63,122,112,.14);border-color:rgba(63,122,112,.30);}
.pan{position:relative;width:min(78vw,430px);height:min(78vw,430px);margin:16px auto 6px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,#191610 0%,#14120F 58%,#0E0C09 100%);box-shadow:inset 0 0 0 1px rgba(233,200,120,.08);} .gong{position:absolute;width:86px;transform:translate(-50%,-50%);background:#211E18;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;} .gong:hover{border-color:rgba(233,200,120,.4);} .gong .di{color:var(--dim);font-size:10px;} .gong .tian{color:var(--gold);font-size:20px;font-weight:700;line-height:1.1;} .gong .jiang{color:#C4B183;font-size:10px;} .gong .ss{color:#7E8C6A;font-size:9px;line-height:1.2;} .gong.focus{border-color:var(--cinnabar);box-shadow:0 0 0 1px rgba(166,58,43,.5);}
.kegs,.chuans{display:grid;gap:8px;margin-top:10px;} .kegs{grid-template-columns:repeat(4,1fr);} .chuans{grid-template-columns:repeat(3,1fr);} .mini{background:#211E18;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;position:relative;cursor:pointer;} .mini:hover{border-color:rgba(233,200,120,.4);} .mini .t{font-size:11px;color:var(--dim);} .mini .z{font-size:22px;font-weight:800;color:var(--gold);} .mini .j{font-size:11px;color:#C4B183;} .mark{position:absolute;top:6px;right:6px;background:var(--cinnabar);color:#F5EFE2;border-radius:7px;padding:1px 5px;font-size:10px;}
.method-chip{display:inline-block;margin-top:8px;border:1px solid rgba(47,74,95,.45);background:rgba(47,74,95,.16);color:#BBD0DE;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;}
.role{display:inline-block;border-radius:8px;color:#F5EFE2;padding:2px 6px;font-size:10px;margin-right:6px;} .role.main{background:var(--cinnabar);} .role.support{background:#8A7B5C;} .role.timing{background:var(--navy);} .role.risk{background:var(--risk);} .role.cross{background:#3E5C76;}
.reason{border-top:1px solid rgba(166,58,43,.15);padding:8px 0;} .reason.main{background:rgba(166,58,43,.08);border:1px solid rgba(166,58,43,.22);border-radius:10px;padding:10px;} .reason .claim{font-weight:700;color:#2B241B;} .paper .reason .ev{color:#4A3F32;font-size:12px;}
.notice{border-radius:10px;padding:8px 10px;font-size:12px;margin:8px 0;} .notice.same{color:var(--navy);background:rgba(47,74,95,.12);} .notice.diff{color:var(--risk);background:rgba(122,46,46,.10);}
.reveal{border:1px dashed rgba(166,58,43,.5);background:rgba(166,58,43,.08);border-radius:12px;padding:12px;margin-top:12px;}
textarea{width:100%;min-height:86px;border-radius:12px;border:1px solid var(--line);background:#100E0B;color:var(--ink);padding:10px;font-family:inherit;font-size:14px;}
.compliance{font-size:11px;color:#6B5F45;margin-top:12px;} footer{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
.asks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:12px;}
.ask{border:1px solid var(--line);background:#1F1C16;border-radius:12px;padding:10px;cursor:pointer;} .ask:hover{border-color:rgba(233,200,120,.45);} .ask.on{border-color:var(--cinnabar);background:#241E19;box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);} .ask b{display:block;color:#F0E6C8;font-size:14px;} .ask .q{color:#C4B183;font-size:12px;margin-top:4px;}
.bd{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10px;margin-bottom:5px;} .bd.orig{background:var(--cinnabar);color:#F5EFE2;} .bd.der{background:var(--navy);color:#DCE8F2;}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
/* ---- 盘上留痕与一占多断并置层（2026-09-20）----
   取证不再只是"点对领提示"：命中处标序号、连线成"占到断"的路径、盘下生成证据签；
   切换占问方向时，上一方向的痕迹以淡色虚线留在盘上，并给一行"两方向各点亮了哪些格"的对照。
   纪律：痕迹只画在**已登记 SURFACES 对应的格**上；并置层只显示位置，不给任何结论。 */
.tlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.tline{fill:none;stroke:#F0D98C;stroke-width:.7;stroke-dasharray:2 1.4;opacity:.55;}
.gline{fill:none;stroke:#8A7B5C;stroke-width:.6;stroke-dasharray:1.6 1.6;opacity:.5;}
/* 格局层（C3）：三传三支都取到才闭合；青色实线以区别于"取证先后"的金色虚线 */
.pline{fill:rgba(127,166,154,.10);stroke:#7FA69A;stroke-width:.85;opacity:.85;}
.gong.traced{border-color:rgba(240,217,140,.8);box-shadow:0 0 0 1px rgba(240,217,140,.35);}
.gong.ghost{border-style:dashed;border-color:rgba(138,123,92,.65);}
.gong .tnum{position:absolute;top:-7px;left:-7px;width:17px;height:17px;line-height:17px;text-align:center;background:var(--gold);color:#1A1410;border-radius:999px;font-size:10px;font-weight:700;}
.gong.ghost .tnum{background:#8A7B5C;color:#14120F;}
.traces{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tchip{border:1px solid rgba(240,217,140,.35);background:rgba(240,217,140,.10);color:#E6DFD0;border-radius:999px;padding:4px 9px;font-size:11px;}
.tchip.ghost{border-style:dashed;border-color:rgba(138,123,92,.6);background:transparent;color:#9c8f74;}
.tsub{width:100%;color:var(--dim);font-size:11px;margin-top:6px;}
.tsep{width:100%;height:1px;background:var(--line);margin:8px 0 2px;}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>壬案推演原型</h1><div class="sub">一局多占版：卷宗 → 选占问方向 → 起盘 → 点盘取证 → 先断后揭</div></div><span class="badge">网页版原型 · 古籍研习参考 · 不构成现实判断</span></header>
<div class="grid">
<aside class="card"><h2>案例库</h2><div class="muted">已同步 APP 案例数据；标「剧情」的案例可作一局多占推演</div><div class="chips" id="topicChips"></div><div id="caseList"></div></aside>
<main class="layout">
<section class="card"><h2>卷宗与推演</h2><div id="briefBox" class="brief">请选择案例。左侧点「剧情」档可只看有「一局多占」剧情的案例（现有 8 案），建议先点「徐次宾占来意」体验。</div><div class="asks" id="askBox"></div><div class="toolbar"><button class="btn" id="startBtn">起盘窥天</button><button class="btn ghost" id="thinkBtn" disabled>沉思</button><button class="btn ghost" id="restartBtn" disabled>重开此案</button></div><div id="clueBox" class="clue-list"></div><div id="logBox" class="log"></div><div id="judgeBox" style="margin-top:12px;"></div><div id="revealBox"></div></section>
<section class="card"><h2>推演盘</h2><div class="muted" id="caseMeta">未起盘</div><div class="facts" id="factBox"></div><div id="methodBox"></div><div class="chuans" id="chuanBox" style="margin-top:10px;"></div><div class="kegs" id="kegBox"></div><div class="pan" id="panBox"></div><div class="traces" id="traceBar"></div><div class="muted" id="traceDiff" style="margin-top:6px;"></div></section>
<section class="card paper" style="grid-column:1/-1;"><h2>证据与规则 <button class="chip" id="reasonToggle" style="margin-left:8px;">展开</button></h2><div id="noticeBox"></div><div id="reasonBox" style="display:none"></div><div class="compliance">本原型仅作传统文化研习与推理练习；剧情内容不用于现实疾病、官讼、投资、气象等判断。</div></section>
</main>
</div>
<footer>LargeLiuRen-Design · UI prototype</footer>
</div>
<script src="_data/duxiang_rules.js"></script><script src="_data/duxiang_leixiang.js"></script><script src="_data/shensha_rules.js"></script><script src="_data/bifa.js"></script><script src="_data/bifa_coach.js"></script><script src="_data/xingnian_score.js"></script><script src="../core/liuren-core.js?v=20260916-batch2"></script><script src="_data/ancient_case_gallery.js?v=20260916-batch2"></script><script src="_data/case_story.js?v=20260916-batch2"></script>
<script>
LiurenCore.init({duxiang:window.DUXIANG_RULES,shensha:window.SHENSHA_RULES,bifa:window.BIFA,xingnian:window.XN_SCORE});
const CASES=window.ANCIENT_CASES||[];
const STORY=window.CASE_STORY||{};
const TOPICS=['全部','来意','疾病','官讼','行人','仕宦','生产','风水','应候','役事','终身','省试','会试','流年','前程','己身','复建','亡盗','远行','索债','赴任','复任','补官','六甲'];
const ROLE_LABEL={main:'主断',support:'旁证',timing:'应期',risk:'风险',cross:'参证'};
const KEYWORDS=['行人','疾病','官讼','来意','失物','赴任','仕宦','生产','应试','流年','风水','复任','补官','役事','省试','会试'];
const DEFAULT_ENDINGS=['藏机','窥豹','得梗','贯通'];
/* SURFACES：登记全部「可点位」（label + 候选锚点）。先登记后挂事件，
   使原型在无头环境下也能遍历校验「每条线索都有点位可点」。
   见 _tests/_test_case_story_web.js */
let SURFACES=[];
let topic='全部',cur=null,chart=null,started=false,askIdx=0,found={},thinkIdx=0,submitted=false;
/* 盘上留痕：trace = 当前方向的证据痕迹（只记"落在哪一格 + 该线索的问句"，不记结论）；
   ghost = 上一方向的痕迹快照，用于「一占多断」的并置对照。二者都不参与 found 判定，
   故切换支线时 found 照样清空（无头反验断言这一点）。 */
let trace=[],ghost=null;
/* 十二宫在盘上的角度（度）——留痕连线与格位共用同一套坐标，避免两处漂移 */
const PAN_ANGLE={午:-90,未:-60,申:-30,酉:0,戌:30,亥:60,子:90,丑:120,寅:150,卯:180,辰:210,巳:240};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function surface(label,cands){SURFACES.push({label:label,cands:cands});return SURFACES.length-1;}
/* 测试钩子：暴露可点位与运行状态，供 _tests/_test_case_story_web.js 无头反验
   （顶层 let 绑定不挂到 window 上，故用函数暴露） */
function protoSurfaces(){return SURFACES;}
function protoState(){const a=askOf();return {caseId:cur?cur.id:'',started:started,askIdx:askIdx,submitted:submitted,found:Object.keys(found),clueTotal:a?a.clues.length:0,hasChart:!!chart,traced:trace.length,tracedCells:traceCellsOrdered(),ghostCells:ghostCells(),patternCells:patternCells()};}
function storyOf(c){return c?STORY[c.id]||null:null;}
function asksOf(c){const st=storyOf(c);return st&&st.asks?st.asks:[];}
function askOf(){const a=asksOf(cur);return a.length?a[Math.min(askIdx,a.length-1)]:null;}
function groupOf(c){if((c.source||'').indexOf('中黄五变经')>=0)return '中黄五变经';if((c.source||'').indexOf('六壬断案')>=0||(c.id||'').indexOf('duanan_')>=0)return '六壬断案';if((c.id||'').indexOf('_yichou_')>=0||(c.title||'').indexOf('乙丑日')>=0||c.chapter==='乙丑日')return '壬占汇选·乙丑日';if((c.id||'').indexOf('_bingyin_')>=0||(c.title||'').indexOf('丙寅日')>=0||c.chapter==='丙寅日')return '壬占汇选·丙寅日';if((c.id||'').indexOf('_dingmao_')>=0||(c.title||'').indexOf('丁卯日')>=0||c.chapter==='丁卯日')return '壬占汇选·丁卯日';if((c.id||'').indexOf('_wuchen_')>=0||(c.title||'').indexOf('戊辰日')>=0||c.chapter==='戊辰日')return '壬占汇选·戊辰日';return '壬占汇选·甲子日';}
function groups(){return ['中黄五变经','六壬断案','壬占汇选·甲子日','壬占汇选·乙丑日','壬占汇选·丙寅日','壬占汇选·丁卯日','壬占汇选·戊辰日'];}
function keywordOf(text){for(const w of KEYWORDS){if((text||'').indexOf(w)>=0)return w;}return '';}
function mainReasoning(c){return c.reasoning&&c.reasoning.length?c.reasoning[0]:null;}
function keyMarks(c){const m=mainReasoning(c),out={};if(!m)return out;(m.evidence||[]).forEach(e=>{if(e.key===true&&e.mark)out[e.ref]=e.mark;});return out;}
function zhiOf(z){return chart?LiurenCore.gongOf(chart.tp,z):'';}
function jiangOf(z){return chart?(chart.jiangMap[zhiOf(z)]||''):'';}
function ssList(z){const b=chart&&chart.dx&&chart.dx.shensha?chart.dx.shensha.byZhi:null;const arr=b&&b[z]?b[z]:[];return arr.map(n=>({kind:'shensha',ref:z+'/'+n}));}
function renderTopics(){$('topicChips').innerHTML=['全部','剧情'].concat(TOPICS.filter(x=>x!=='全部')).map(t=>`<button class="chip ${topic===t?'on':''}" data-t="${t}">${t}</button>`).join('');$('topicChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.t;renderTopics();renderList();});}
function renderList(){const list=CASES.filter(c=>topic==='全部'||(topic==='剧情'?!!storyOf(c):(c.topics||[]).indexOf(topic)>=0));let html='';groups().forEach(g=>{const arr=list.filter(c=>groupOf(c)===g);if(!arr.length)return;html+=`<div class="group">${g}</div>`;arr.forEach(c=>{const has=!!storyOf(c);html+=`<div class="case-item ${cur&&cur.id===c.id?'on':''}" data-id="${esc(c.id)}"><b>${esc(c.title)}</b><small>${(c.topics||[]).join(' / ')} · ${esc(c.chapter)}${has?' · <span class="bd orig">剧情</span>':''}</small></div>`;});});$('caseList').innerHTML=html||'<div class="muted">此占类暂无案例</div>';$('caseList').querySelectorAll('.case-item').forEach(el=>el.onclick=()=>selectCase(el.dataset.id));}
function selectCase(id){cur=CASES.find(c=>c.id===id)||null;chart=null;started=false;askIdx=0;found={};thinkIdx=0;submitted=false;trace=[];ghost=null;if(cur){const inp=cur.input;chart=LiurenCore.buildChartAncient(inp.mj,inp.dg,inp.dz,inp.hour,inp.yearGan||inp.yg||'',inp.yearZhi||inp.yz||'',inp.monthZhi||'');}renderList();renderAll();}
function pickAsk(i){if(!cur)return;const a=asksOf(cur);if(!a.length||i===askIdx)return;
  /* 并置层：把当前方向的痕迹留给下一方向作对照（只留位置与问句，不含任何结论） */
  if(trace.length)ghost={title:(a[askIdx]&&a[askIdx].title)||'',items:trace.slice()};
  askIdx=i;found={};thinkIdx=0;submitted=false;trace=[];$('logBox').innerHTML='';if(started)log('换了个占问方向：'+a[i].title+'。同一课，取象随之而变。','good');renderAll();}
function renderBrief(){if(!cur){$('briefBox').innerHTML='请选择案例。左侧点「剧情」档可只看有「一局多占」剧情的案例，建议先点「徐次宾占来意」体验。';$('askBox').innerHTML='';return;}const st=storyOf(cur);$('briefBox').innerHTML=st?esc(st.brief)+(st.note?`<div class="muted" style="margin-top:6px;">${esc(st.note)}</div>`:''):(esc(cur.summary||cur.title)+'<div class="notice diff">本案例暂无「一局多占」剧情（当前 '+Object.keys(STORY).length+' 案有剧情——左侧点「剧情」档即可只看它们）。下面仍可起盘、读证据链与点盘位。</div>');const a=asksOf(cur);$('askBox').innerHTML=a.length?a.map((x,i)=>{const cls=x.role==='derived'?'der':'orig';const bd=x.badge||(x.role==='derived'?'异占支线':'古籍原占');return `<div class="ask ${i===askIdx?'on':''}" data-i="${i}"><span class="bd ${cls}">${esc(bd)}</span><b>${esc(x.title)}</b><div class="q">问：${esc(x.question||'')}</div></div>`;}).join(''):'';$('askBox').querySelectorAll('.ask').forEach(el=>el.onclick=()=>pickAsk(Number(el.dataset.i)));}
function clueFoundCount(){const a=askOf();return a?a.clues.filter(c=>found[c.id]).length:0;}

/* ---- 盘上留痕（数据侧）：锚点 → 盘上格 ----
   盘面按**地盘宫**定位，故"格"= 地盘宫名。口径：
     gong（宫）/ hour（占时）：ref 本身就是地盘宫 → 直接取；
     zhi（支）/ chuan / jiang / keg / shensha / xunkong：ref 首段是**天盘支** →
       用 zhiOf() 求它此刻压在哪一地盘宫（与 App 侧"乘将挂在支上"同一算法）。
   返回 '' 表示该锚点不在盘上（课名、日干旺衰等属"事实栏"），只在证据签里出现。 */
function cellOfAnchor(an){
  const k=an.kind,ref=String(an.ref||'').split('/')[0].trim();

/* 留痕顺序：占时那一格（= 地盘占时宫，"月将加时"的入局处）若在痕迹里，从它起画，随后按取证先后。 */
function traceCellsOrdered(){
  const out=[];

  if(hz&&trace.some(t=>t.cells.indexOf(hz)>=0))out.push(hz);
  trace.forEach(t=>t.cells.forEach(z=>{if(out.indexOf(z)<0)out.push(z);}));

function renderReasons(){const nb=$('noticeBox'),rb=$('reasonBox'),a=askOf();if(!cur){nb.innerHTML='';rb.innerHTML='<div class="muted">请选择案例。</div>';return;}if(a&&a.role==='derived'){nb.innerHTML='<div class="notice same">异占支线：只给取象与规则依据，不给断语</div>';const hs=a.clues.filter(c=>found[c.id]).map(c=>`<div class="ev">· ${esc(c.hint)}</div>`).join('');rb.innerHTML=`<div class="reason main"><span class="role cross">取象</span><span class="claim">${esc(a.title)}</span><div class="muted">${esc(a.intro||'')}</div>${hs||'<div class="ev">· 尚未点盘取证。</div>'}<div class="muted">${esc(a.ending&&a.ending.note||'')}</div></div>`;return;}nb.innerHTML='';if(!cur.reasoning||!cur.reasoning.length){rb.innerHTML='<div class="muted">此案尚未补证据链。</div>';return;}const mk=keywordOf(mainReasoning(cur).claim),same=mk?cur.reasoning.filter(r=>r.role!=='main'&&(r.claim||'').indexOf(mk)>=0).length:0,diff=mk?cur.reasoning.filter(r=>r.role!=='main'&&keywordOf(r.claim)&&keywordOf(r.claim)!==mk):[];let nh='';if(same)nh+=`<div class="notice same">多链同断：${esc(mk)} · 主链外另有 ${same} 条佐证</div>`;if(diff.length)nh+=`<div class="notice diff">异断对读：主断为「${esc(mk)}」，另有 ${diff.length} 条落在其他占类，宜分列参看</div>`;nb.innerHTML=nh;rb.innerHTML=cur.reasoning.map(r=>{const role=r.role||'support',divergent=diff.some(x=>x.claim===r.claim)?'<span class="role timing">异断</span>':'',ev=(r.evidence||[]).map(e=>`<div class="ev">· ${esc(e.why)}${e.mark&&e.key===true?` <b style="color:#A63A2B">[${esc(e.mark)}]</b>`:''}</div>`).join('');return `<div class="reason ${role==='main'?'main':''}"><span class="role ${role}">${ROLE_LABEL[role]||'旁证'}</span>${divergent}<span class="claim">${esc(r.claim)}</span><div class="muted">${esc(r.ruleRef||'')}</div>${ev}${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</div>`;}).join('');}
function renderAll(){renderBrief();renderClues();renderChart();renderReasons();$('startBtn').disabled=!cur||started;const a=askOf();$('thinkBtn').disabled=!cur||!started||!a||clueFoundCount()>=a.clues.length;$('restartBtn').disabled=!cur||!started;if(!submitted){$('revealBox').innerHTML='';renderJudge();}}
$('startBtn').onclick=()=>{if(!cur||started)return;started=true;const a=askOf();log('盘已起。'+(a?'今问「'+a.question+'」——先观课体，再察四课三传；不明处可点「沉思」。':'先观课体，再察四课三传。'),'good');renderAll();};
/* 把锚点翻译成"人话位置"，供沉思第二步使用 */
function whereOf(an){const z=an.ref||'';if(an.kind==='method')return '点盘面上方的「课名」';if(an.kind==='chuan')return '点三传卡片中的「'+(z||'')+'」那一支'+(an.pos?'（'+an.pos+'）':'');if(an.kind==='keg')return '点四课里的「'+z+'」';if(an.kind==='jiang')return '点三传或天地盘上「'+(z.split('/')[0]||'')+'」的乘将那行';if(an.kind==='shensha'){const q=z.split('/');return '点天地盘上「'+q[0]+'」那一格的**神煞**那行（找「'+q[1]+'」；格子四行是天支/地盘/乘将/神煞）';}if(an.kind==='xunkong')return '点下方事实栏的「旬空'+z+'」';if(an.kind==='dayWangShuai')return '点下方事实栏的「日干旺衰'+z+'」';if(an.kind==='hour')return '点下方事实栏的「时支'+z+'」';if(an.kind==='gong'||an.kind==='zhi')return '点天地盘上「'+z+'」那一格（要点它的**天支**那一行，不是地盘那行）';return '点「'+(z||'相关位置')+'」';}
const thinkStage={};
$('thinkBtn').onclick=()=>{const a=askOf();if(!a)return;const rest=a.clues.filter(c=>!found[c.id]);if(!rest.length)return;const c=rest[thinkIdx%rest.length];thinkIdx++;const st=(thinkStage[c.id]||0);thinkStage[c.id]=st+1;if(st===0){log('沉思：'+c.small+'（'+c.label+'）','');}else{const spots=(c.anchors||[]).map(whereOf);log('再想一层——'+c.label+' 的取处：'+spots.join('；')+'。','');}};
$('restartBtn').onclick=()=>{found={};thinkIdx=0;submitted=false;trace=[];$('logBox').innerHTML='';$('revealBox').innerHTML='';log('重开此案：线索已清（上一方向的对照痕迹保留），占问方向与盘面保留。','good');renderAll();};
$('reasonToggle').onclick=()=>{const b=$('reasonBox');const open=b.style.display!=='none';b.style.display=open?'none':'';$('reasonToggle').textContent=open?'展开':'收起';};
renderTopics();renderList();renderAll();
