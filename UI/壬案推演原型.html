<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壬案推演原型 · 线索树版</title>
<style>
:root{--bg:#14120F;--panel:#1C1A16;--panel2:#24211A;--paper:#F5EFE2;--ink:#E6DFD0;--gold:#F0D98C;--gold-d:#A8843C;--dim:#8A7B5C;--line:rgba(233,200,120,.18);--cinnabar:#A63A2B;--navy:#2F4A5F;--green:#3F7A70;--risk:#7A2E2E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(circle at 50% 0%,#1d1913,var(--bg));color:var(--ink);font-family:"HarmonyOS Sans","Microsoft YaHei",sans-serif;line-height:1.7;}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
header{padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;}
h1{color:var(--gold);font-size:28px;letter-spacing:5px;}
.sub{color:var(--dim);font-size:13px;margin-top:4px;}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--gold-d);font-size:12px;}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;} @media(max-width:920px){.grid{grid-template-columns:1fr;}}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);}
.card.paper{background:linear-gradient(160deg,#F7F1E0,#EFE3C8);color:#2B241B;border-color:rgba(166,58,43,.25);}
.card h2{color:var(--gold);font-size:18px;margin-bottom:8px;letter-spacing:2px;} .card.paper h2{color:var(--cinnabar);}
.muted{color:var(--dim);font-size:12px;} .paper .muted{color:#6A5F4B;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;} .chip{border:1px solid var(--line);background:#211E18;color:#C4B183;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;} .chip.on{background:#E9C878;color:#1A1410;font-weight:700;}
.group{color:var(--gold-d);font-size:12px;margin:12px 0 6px;letter-spacing:1px;}
.case-item{border:1px solid var(--line);background:#1C1A16;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;} .case-item:hover{border-color:rgba(233,200,120,.45);} .case-item.on{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);} .case-item b{display:block;color:#F0E6C8;font-size:14px;} .case-item small{color:var(--dim);display:block;margin-top:3px;}
.layout{display:grid;grid-template-columns:1.02fr .98fr;gap:16px;align-items:start;} @media(max-width:1100px){.layout{grid-template-columns:1fr;}}
.brief{background:rgba(240,217,140,.08);border-left:3px solid var(--gold-d);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.9;}
.btn{background:linear-gradient(135deg,#8a6a1e,var(--gold-d));border:none;color:#14100A;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;letter-spacing:1px;} .btn.ghost{background:#211E18;color:#C4B183;border:1px solid var(--line);} .btn:disabled{opacity:.4;cursor:not-allowed;} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.clue-list{margin-top:12px;display:grid;gap:8px;} .clue{border:1px solid var(--line);background:#211E18;border-radius:12px;padding:10px;color:#C4B183;font-size:13px;} .clue small{display:block;color:var(--dim);margin-top:3px;} .clue.found{border-color:rgba(63,122,112,.7);color:#DFF3EA;background:rgba(63,122,112,.14);} .clue.next{border-color:rgba(240,217,140,.45);}
.log{margin-top:12px;display:grid;gap:8px;max-height:220px;overflow:auto;} .logline{border-radius:10px;padding:9px 10px;font-size:13px;background:rgba(240,217,140,.07);color:#E6DFD0;border:1px solid rgba(233,200,120,.12);} .logline.bad{background:rgba(122,46,46,.12);border-color:rgba(122,46,46,.28);color:#E7C9C4;} .logline.good{background:rgba(63,122,112,.14);border-color:rgba(63,122,112,.30);}
.pan{position:relative;width:min(78vw,430px);height:min(78vw,430px);margin:16px auto 6px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,#191610 0%,#14120F 58%,#0E0C09 100%);box-shadow:inset 0 0 0 1px rgba(233,200,120,.08);} .gong{position:absolute;width:86px;transform:translate(-50%,-50%);background:#211E18;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;} .gong:hover{border-color:rgba(233,200,120,.4);} .gong .di{color:var(--dim);font-size:10px;} .gong .tian{color:var(--gold);font-size:20px;font-weight:700;line-height:1.1;} .gong .jiang{color:#C4B183;font-size:10px;} .gong.focus{border-color:var(--cinnabar);box-shadow:0 0 0 1px rgba(166,58,43,.5);}
.kegs,.chuans{display:grid;gap:8px;margin-top:10px;} .kegs{grid-template-columns:repeat(4,1fr);} .chuans{grid-template-columns:repeat(3,1fr);} .mini{background:#211E18;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;position:relative;cursor:pointer;} .mini:hover{border-color:rgba(233,200,120,.4);} .mini .t{font-size:11px;color:var(--dim);} .mini .z{font-size:22px;font-weight:800;color:var(--gold);} .mini .j{font-size:11px;color:#C4B183;} .mark{position:absolute;top:6px;right:6px;background:var(--cinnabar);color:#F5EFE2;border-radius:7px;padding:1px 5px;font-size:10px;}
.method-chip{display:inline-block;margin-top:8px;border:1px solid rgba(47,74,95,.45);background:rgba(47,74,95,.16);color:#BBD0DE;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;}
.role{display:inline-block;border-radius:8px;color:#F5EFE2;padding:2px 6px;font-size:10px;margin-right:6px;} .role.main{background:var(--cinnabar);} .role.support{background:#8A7B5C;} .role.timing{background:var(--navy);} .role.risk{background:var(--risk);} .role.cross{background:#3E5C76;}
.reason{border-top:1px solid rgba(166,58,43,.15);padding:8px 0;} .reason.main{background:rgba(166,58,43,.08);border:1px solid rgba(166,58,43,.22);border-radius:10px;padding:10px;} .reason .claim{font-weight:700;color:#2B241B;} .paper .reason .ev{color:#4A3F32;font-size:12px;}
.notice{border-radius:10px;padding:8px 10px;font-size:12px;margin:8px 0;} .notice.same{color:var(--navy);background:rgba(47,74,95,.12);} .notice.diff{color:var(--risk);background:rgba(122,46,46,.10);}
.reveal{border:1px dashed rgba(166,58,43,.5);background:rgba(166,58,43,.08);border-radius:12px;padding:12px;margin-top:12px;}
textarea{width:100%;min-height:86px;border-radius:12px;border:1px solid var(--line);background:#100E0B;color:var(--ink);padding:10px;font-family:inherit;font-size:14px;}
.compliance{font-size:11px;color:#6B5F45;margin-top:12px;} footer{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>壬案推演原型</h1><div class="sub">线索树版：卷宗 → 起盘 → 疑点清单 → 点盘取证 → 先断后揭</div></div><span class="badge">网页版原型 · 古籍研习参考 · 不构成现实判断</span></header>
<div class="grid">
<aside class="card"><h2>案例库</h2><div class="muted">已同步 APP 案例数据：分组 + 占类筛选</div><div class="chips" id="topicChips"></div><div id="caseList"></div></aside>
<main class="layout">
<section class="card"><h2>卷宗与推演</h2><div id="briefBox" class="brief">请选择案例。建议先点「雪心占行人」体验线索树原型。</div><div class="toolbar"><button class="btn" id="startBtn">起盘窥天</button><button class="btn ghost" id="thinkBtn" disabled>沉思</button><button class="btn ghost" id="restartBtn" disabled>重开此案</button></div><div id="clueBox" class="clue-list"></div><div id="logBox" class="log"></div><div id="judgeBox" style="margin-top:12px;"></div><div id="revealBox"></div></section>
<section class="card"><h2>推演盘</h2><div class="muted" id="caseMeta">未起盘</div><div id="methodBox"></div><div class="chuans" id="chuanBox" style="margin-top:10px;"></div><div class="kegs" id="kegBox"></div><div class="pan" id="panBox"></div></section>
<section class="card paper" style="grid-column:1/-1;"><h2>断语证据链</h2><div id="noticeBox"></div><div id="reasonBox"></div><div class="compliance">本原型仅作传统文化研习与推理练习；剧情内容不用于现实疾病、官讼、投资等判断。</div></section>
</main>
</div>
<footer>LargeLiuRen-Design · UI prototype</footer>
</div>
<script src="_data/duxiang_rules.js"></script><script src="_data/duxiang_leixiang.js"></script><script src="_data/shensha_rules.js"></script><script src="_data/bifa.js"></script><script src="_data/bifa_coach.js"></script><script src="_data/xingnian_score.js"></script><script src="../core/liuren-core.js?v=20260827-clue"></script><script src="_data/ancient_case_gallery.js?v=20260827-clue"></script>
<script>
LiurenCore.init({duxiang:window.DUXIANG_RULES,shensha:window.SHENSHA_RULES,bifa:window.BIFA,xingnian:window.XN_SCORE});
const CASES=window.ANCIENT_CASES||[];
const TOPICS=['全部','来意','疾病','官讼','行人','仕宦','生产','风水','应候','役事','终身','省试','会试','流年','前程','己身','复建','亡盗','远行','索债','赴任','复任','补官','六甲'];
const ROLE_LABEL={main:'主断',support:'旁证',timing:'应期',risk:'风险',cross:'参证'};
const KEYWORDS=['行人','疾病','官讼','来意','失物','赴任','仕宦','生产','应试','流年','风水','复任','补官','役事','省试','会试'];
const STORY={'renzhan_jiazi_011_xue_xingren':{brief:'十月甲子日，卯将子时。贵人占从人到否。雪心令其先莫问吉凶，只凝神看盘：人已动否？归期迟速？',clues:[
{id:'method',label:'先看课体：此课是动是静？',small:'课名可点',kind:'method',hint:'课名即课体骨架，先据此定动静迟速，再入四课三传。'},
{id:'ma',label:'行人看动象：马在何处？',small:'点三传/天地盘中的关键支',kind:'chuan',pos:'末传',ref:'寅',hint:'末传寅为马，马动主归。'},
{id:'kong',label:'既归，何以言迟？',small:'点三传/天地盘中的关键支',kind:'chuan',pos:'中传',ref:'亥',hint:'中传亥空，归途有名未实，故主来而迟。'}],goodWords:['来','归','迟','马','空','亥'],endings:['藏机','窥豹','得梗','贯通']}};
let topic='全部',cur=null,chart=null,started=false,found={},thinkIdx=0,submitted=false;
function $(id){return document.getElementById(id);}
function storyOf(c){return c?STORY[c.id]||null:null;}
function groupOf(c){if((c.source||'').indexOf('中黄五变经')>=0)return '中黄五变经';if((c.source||'').indexOf('六壬断案')>=0||(c.id||'').indexOf('duanan_')>=0)return '六壬断案';if((c.id||'').indexOf('_yichou_')>=0||(c.title||'').indexOf('乙丑日')>=0||c.chapter==='乙丑日')return '壬占汇选·乙丑日';if((c.id||'').indexOf('_bingyin_')>=0||(c.title||'').indexOf('丙寅日')>=0||c.chapter==='丙寅日')return '壬占汇选·丙寅日';return '壬占汇选·甲子日';}
function groups(){return ['中黄五变经','六壬断案','壬占汇选·甲子日','壬占汇选·乙丑日','壬占汇选·丙寅日'];}
function keywordOf(text){for(const w of KEYWORDS){if((text||'').indexOf(w)>=0)return w;}return '';}
function mainReasoning(c){return c.reasoning&&c.reasoning.length?c.reasoning[0]:null;}
function keyMarks(c){const m=mainReasoning(c),out={};if(!m)return out;(m.evidence||[]).forEach(e=>{if(e.key===true&&e.mark)out[e.ref]=e.mark;});return out;}
function renderTopics(){$('topicChips').innerHTML=TOPICS.map(t=>`<button class="chip ${topic===t?'on':''}" data-t="${t}">${t}</button>`).join('');$('topicChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.t;renderTopics();renderList();});}
function renderList(){const list=CASES.filter(c=>topic==='全部'||(c.topics||[]).indexOf(topic)>=0);let html='';groups().forEach(g=>{const arr=list.filter(c=>groupOf(c)===g);if(!arr.length)return;html+=`<div class="group">${g}</div>`;arr.forEach(c=>{html+=`<div class="case-item ${cur&&cur.id===c.id?'on':''}" data-id="${c.id}"><b>${c.title}</b><small>${(c.topics||[]).join(' / ')} · ${c.chapter}</small></div>`;});});$('caseList').innerHTML=html||'<div class="muted">此占类暂无案例</div>';$('caseList').querySelectorAll('.case-item').forEach(el=>el.onclick=()=>selectCase(el.dataset.id));}
function selectCase(id){cur=CASES.find(c=>c.id===id)||null;chart=null;started=false;found={};thinkIdx=0;submitted=false;if(cur){const inp=cur.input;chart=LiurenCore.buildChartAncient(inp.mj,inp.dg,inp.dz,inp.hour,inp.yg||'',inp.yz||'',inp.monthZhi||'');}renderList();renderAll();}
function renderBrief(){if(!cur){$('briefBox').textContent='请选择案例。建议先点「雪心占行人」体验线索树原型。';return;}const st=storyOf(cur);$('briefBox').innerHTML=st?st.brief:((cur.summary||cur.title)+'<br><span class="muted">此案尚未写剧情脚本，可先起盘读证据链。</span>');}
function clueFoundCount(){const st=storyOf(cur);return st?st.clues.filter(c=>found[c.id]).length:0;}
function renderClues(){const box=$('clueBox'),st=storyOf(cur);if(!cur||!started||!st){box.innerHTML='';return;}const next=st.clues.find(c=>!found[c.id]);box.innerHTML='<div class="muted">疑点清单</div>'+st.clues.map(c=>`<div class="clue ${found[c.id]?'found':''} ${next&&next.id===c.id?'next':''}">${found[c.id]?'✓ ':'○ '}${c.label}<small>${found[c.id]?c.hint:c.small}</small></div>`).join('');}
function log(text,kind){const div=document.createElement('div');div.className='logline '+(kind||'');div.textContent=text;$('logBox').prepend(div);}
function tryDiscover(kind,ref,label){if(!cur||!started)return;const st=storyOf(cur);if(!st)return;let hit=null;st.clues.forEach(c=>{if(found[c.id])return;if(c.kind===kind&&(c.ref?c.ref===ref:true))hit=c;});if(hit){found[hit.id]=true;log('灵光一现：'+hit.hint,'good');if(clueFoundCount()===st.clues.length)log('线索已集，宜先立断语，再揭古断。','good');renderAll();}else{log('你盯着'+label+'良久，似与当前主断无涉，且再观他处。','bad');}}
function renderJudge(){const box=$('judgeBox'),st=storyOf(cur);if(!cur||!started||!st||submitted||clueFoundCount()<st.clues.length){if(!submitted)box.innerHTML='';return;}box.innerHTML='<div class="muted">线索已集。请先立断语，再揭古断。</div><textarea id="userVerdict" placeholder="例：行人主来而迟，末传寅马主归，中传亥空故迟……"></textarea><div class="toolbar"><button class="btn" id="submitBtn">呈上断语</button></div>';$('submitBtn').onclick=submitVerdict;}
function submitVerdict(){const st=storyOf(cur);if(!st||submitted)return;const text=($('userVerdict')?$('userVerdict').value:'').trim();let score=clueFoundCount();st.goodWords.forEach(w=>{if(text.indexOf(w)>=0)score+=0.5;});const max=st.clues.length+st.goodWords.length*0.5,ratio=max?score/max:0;let level=0;if(ratio>=0.85)level=3;else if(ratio>=0.6)level=2;else if(ratio>=0.35)level=1;submitted=true;$('judgeBox').innerHTML='';$('revealBox').innerHTML=`<div class="reveal"><b style="color:#F0D98C">结局 · ${st.endings[level]}</b><div style="margin-top:6px;">${cur.original}</div><div class="muted" style="margin-top:8px;">你的断语：${text||'（未书）'}</div><div class="muted" style="margin-top:6px;">复盘：${cur.summary}</div></div>`;}
function renderChart(){const has=!!cur&&started&&!!chart;$('caseMeta').textContent=has?(cur.title+' · '+cur.input.mj+'将 '+cur.input.dg+cur.input.dz+'日 '+cur.input.hour+'时 · 旬空'+(chart.dx.xunkong.length?chart.dx.xunkong.join(''):'无')):'未起盘';if(!has){$('methodBox').innerHTML='';$('panBox').innerHTML='';$('kegBox').innerHTML='';$('chuanBox').innerHTML='';return;}const marks=keyMarks(cur);$('methodBox').innerHTML=`<span class="method-chip" id="methodChip">课名 ${chart.sanchuan.method}</span>`;$('methodChip').onclick=()=>tryDiscover('method',chart.sanchuan.method,'课名');
const chuans=chart.sanchuan.chuans;$('chuanBox').innerHTML=[2,1,0].map(i=>{const q=chuans[i],mk=marks[q.z]?`<span class="mark">${marks[q.z]}</span>`:'';return `<div class="mini" data-z="${q.z}">${mk}<div class="t">${['初传','中传','末传'][i]}</div><div class="z">${q.gz}</div><div class="j">${chart.jiangMap[LiurenCore.gongOf(chart.tp,q.z)]||''}</div></div>`;}).join('');$('chuanBox').querySelectorAll('.mini').forEach(el=>el.onclick=()=>tryDiscover('chuan',el.dataset.z,'三传'+el.dataset.z));
$('kegBox').innerHTML=[3,2,1,0].map(i=>{const k=chart.kegs[i];return `<div class="mini" data-z="${k.x}"><div class="t">第${['一','二','三','四'][i]}课</div><div class="z">${k.x}/${k.s}</div><div class="j">${chart.jiangMap[LiurenCore.gongOf(chart.tp,k.x)]||''}</div></div>`;}).join('');$('kegBox').querySelectorAll('.mini').forEach(el=>el.onclick=()=>tryDiscover('chuan',el.dataset.z,'四课'+el.dataset.z));
const angle={午:-90,未:-60,申:-30,酉:0,戌:30,亥:60,子:90,丑:120,寅:150,卯:180,辰:210,巳:240};$('panBox').innerHTML=LiurenCore.ZHI.map(z=>{const g=LiurenCore.gongOf(chart.tp,z),j=chart.jiangMap[g]||'',focus=marks[z]?' focus':'',a=(angle[z]||0)*Math.PI/180,left=(50+42*Math.cos(a)).toFixed(2),top=(50+42*Math.sin(a)).toFixed(2);return `<div class="gong${focus}" data-z="${z}" style="left:${left}%;top:${top}%;">${marks[z]?`<span class="mark">${marks[z]}</span>`:''}<div class="tian">${z}</div><div class="di">地盘 ${g}</div><div class="jiang">${j}</div></div>`;}).join('');$('panBox').querySelectorAll('.gong').forEach(el=>el.onclick=()=>tryDiscover('chuan',el.dataset.z,'天地盘'+el.dataset.z));}
function renderReasons(){const nb=$('noticeBox'),rb=$('reasonBox');if(!cur||!cur.reasoning||!cur.reasoning.length){nb.innerHTML='';rb.innerHTML='<div class="muted">此案尚未补证据链。</div>';return;}const mk=keywordOf(mainReasoning(cur).claim),same=mk?cur.reasoning.filter(r=>r.role!=='main'&&(r.claim||'').indexOf(mk)>=0).length:0,diff=mk?cur.reasoning.filter(r=>r.role!=='main'&&keywordOf(r.claim)&&keywordOf(r.claim)!==mk):[];let nh='';if(same)nh+=`<div class="notice same">多链同断：${mk} · 主链外另有 ${same} 条佐证</div>`;if(diff.length)nh+=`<div class="notice diff">异断对读：主断为「${mk}」，另有 ${diff.length} 条落在其他占类，宜分列参看</div>`;nb.innerHTML=nh;rb.innerHTML=cur.reasoning.map(r=>{const role=r.role||'support',divergent=diff.some(x=>x.claim===r.claim)?'<span class="role timing">异断</span>':'',ev=(r.evidence||[]).map(e=>`<div class="ev">· ${e.why}${e.mark&&e.key===true?` <b style="color:#A63A2B">[${e.mark}]</b>`:''}</div>`).join('');return `<div class="reason ${role==='main'?'main':''}"><span class="role ${role}">${ROLE_LABEL[role]||'旁证'}</span>${divergent}<span class="claim">${r.claim}</span><div class="muted">${r.ruleRef||''}</div>${ev}${r.note?`<div class="muted">${r.note}</div>`:''}</div>`;}).join('');}
function renderAll(){renderBrief();renderClues();renderChart();renderReasons();$('startBtn').disabled=!cur||started;const st=storyOf(cur);$('thinkBtn').disabled=!cur||!started||!st||clueFoundCount()>=st.clues.length;$('restartBtn').disabled=!cur||!started;if(!submitted){$('revealBox').innerHTML='';renderJudge();}}
$('startBtn').onclick=()=>{if(!cur||started)return;started=true;log('盘已起。先观课体，再察四课三传；不明处，可点“沉思”。','good');renderAll();};
$('thinkBtn').onclick=()=>{const st=storyOf(cur);if(!st)return;const rest=st.clues.filter(c=>!found[c.id]);if(!rest.length)return;const c=rest[thinkIdx%rest.length];thinkIdx++;log('沉思：'+c.hint,'');};
$('restartBtn').onclick=()=>{if(cur)selectCase(cur.id);};
renderTopics();renderList();renderAll();
</script>
</body>
</html>
