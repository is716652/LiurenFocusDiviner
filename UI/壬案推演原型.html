<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壬案推演原型 · 一局多占版</title>
<style>
:root{--bg:#14120F;--panel:#1C1A16;--panel2:#24211A;--paper:#F5EFE2;--ink:#E6DFD0;--gold:#F0D98C;--gold-d:#A8843C;--dim:#8A7B5C;--line:rgba(233,200,120,.18);--cinnabar:#A63A2B;--navy:#2F4A5F;--green:#3F7A70;--risk:#7A2E2E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(circle at 50% 0%,#1d1913,var(--bg));color:var(--ink);font-family:"HarmonyOS Sans","Microsoft YaHei",sans-serif;line-height:1.7;}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
header{padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;}
h1{color:var(--gold);font-size:28px;letter-spacing:5px;}
.sub{color:var(--dim);font-size:13px;margin-top:4px;}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--gold-d);font-size:12px;}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;} @media(max-width:920px){.grid{grid-template-columns:1fr;}}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);}
.card.paper{background:linear-gradient(160deg,#F7F1E0,#EFE3C8);color:#2B241B;border-color:rgba(166,58,43,.25);}
.card h2{color:var(--gold);font-size:18px;margin-bottom:8px;letter-spacing:2px;} .card.paper h2{color:var(--cinnabar);}
.muted{color:var(--dim);font-size:12px;} .paper .muted{color:#6A5F4B;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;} .chip{border:1px solid var(--line);background:#211E18;color:#C4B183;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;} .chip.on{background:#E9C878;color:#1A1410;font-weight:700;}
/* 案例库筛选（2026-09-21）：标签从数据生成并带条数 —— 45 案撒在 20+ 个占类上，
   不给数字就分不清"筛出来了"和"点了没反应"；筛选结果也一律写明"筛出几条"。
   注：旧死表里的 `六甲` 命中 0 条，点了必然空，已随死表一起废掉。 */
.case-search{width:100%;margin-top:8px;border:1px solid var(--line);background:#100E0B;color:var(--ink);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px;}
.case-search::placeholder{color:#6B5F45;}
.chip .cnt{display:inline-block;margin-left:5px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.35);color:#E9C878;font-size:10px;}
.chip.on .cnt{background:rgba(0,0,0,.22);color:#2B241B;}
.list-info{color:var(--dim);font-size:11px;margin:2px 0 8px;}
.list-info b{color:var(--gold);}
.group .gn{float:right;color:var(--dim);font-size:11px;font-weight:400;}
.group{color:var(--gold-d);font-size:12px;margin:12px 0 6px;letter-spacing:1px;}
.case-item{border:1px solid var(--line);background:#1C1A16;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;} .case-item:hover{border-color:rgba(233,200,120,.45);} .case-item.on{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);} .case-item b{display:block;color:#F0E6C8;font-size:14px;} .case-item small{color:var(--dim);display:block;margin-top:3px;}
.layout{display:grid;grid-template-columns:1.02fr .98fr;gap:16px;align-items:start;} @media(max-width:1100px){.layout{grid-template-columns:1fr;}}
.brief{background:rgba(240,217,140,.08);border-left:3px solid var(--gold-d);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.9;}
.btn{background:linear-gradient(135deg,#8a6a1e,var(--gold-d));border:none;color:#14100A;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;letter-spacing:1px;} .btn.ghost{background:#211E18;color:#C4B183;border:1px solid var(--line);} .btn:disabled{opacity:.4;cursor:not-allowed;} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.clue-list{margin-top:12px;display:grid;gap:8px;} .clue{border:1px solid var(--line);background:#211E18;border-radius:12px;padding:10px;color:#C4B183;font-size:13px;} .clue small{display:block;color:var(--dim);margin-top:3px;} .clue.found{border-color:rgba(63,122,112,.7);color:#DFF3EA;background:rgba(63,122,112,.14);} .clue.next{border-color:rgba(240,217,140,.45);}
.log{margin-top:12px;display:grid;gap:8px;max-height:200px;overflow:auto;} .logline{border-radius:10px;padding:9px 10px;font-size:13px;background:rgba(240,217,140,.07);color:#E6DFD0;border:1px solid rgba(233,200,120,.12);} .logline.bad{background:rgba(122,46,46,.12);border-color:rgba(122,46,46,.28);color:#E7C9C4;} .logline.good{background:rgba(63,122,112,.14);border-color:rgba(63,122,112,.30);}
.pan{position:relative;width:min(78vw,430px);height:min(78vw,430px);margin:16px auto 6px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,#191610 0%,#14120F 58%,#0E0C09 100%);box-shadow:inset 0 0 0 1px rgba(233,200,120,.08);} .gong{position:absolute;width:86px;transform:translate(-50%,-50%);background:#211E18;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;} .gong:hover{border-color:rgba(233,200,120,.4);} .gong .di{color:var(--dim);font-size:10px;} .gong .tian{color:var(--gold);font-size:20px;font-weight:700;line-height:1.1;} .gong .jiang{color:#C4B183;font-size:10px;} .gong .ss{color:#7E8C6A;font-size:9px;line-height:1.2;} .gong.focus{border-color:var(--cinnabar);box-shadow:0 0 0 1px rgba(166,58,43,.5);}
.kegs,.chuans{display:grid;gap:8px;margin-top:10px;} .kegs{grid-template-columns:repeat(4,1fr);} .chuans{grid-template-columns:repeat(3,1fr);} .mini{background:#211E18;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;position:relative;cursor:pointer;} .mini:hover{border-color:rgba(233,200,120,.4);} .mini .t{font-size:11px;color:var(--dim);} .mini .z{font-size:22px;font-weight:800;color:var(--gold);} .mini .j{font-size:11px;color:#C4B183;} .mark{position:absolute;top:6px;right:6px;background:var(--cinnabar);color:#F5EFE2;border-radius:7px;padding:1px 5px;font-size:10px;}
.method-chip{display:inline-block;margin-top:8px;border:1px solid rgba(47,74,95,.45);background:rgba(47,74,95,.16);color:#BBD0DE;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;}
.role{display:inline-block;border-radius:8px;color:#F5EFE2;padding:2px 6px;font-size:10px;margin-right:6px;} .role.main{background:var(--cinnabar);} .role.support{background:#8A7B5C;} .role.timing{background:var(--navy);} .role.risk{background:var(--risk);} .role.cross{background:#3E5C76;}
.reason{border-top:1px solid rgba(166,58,43,.15);padding:8px 0;} .reason.main{background:rgba(166,58,43,.08);border:1px solid rgba(166,58,43,.22);border-radius:10px;padding:10px;} .reason .claim{font-weight:700;color:#2B241B;} .paper .reason .ev{color:#4A3F32;font-size:12px;}
.notice{border-radius:10px;padding:8px 10px;font-size:12px;margin:8px 0;} .notice.same{color:var(--navy);background:rgba(47,74,95,.12);} .notice.diff{color:var(--risk);background:rgba(122,46,46,.10);}
.reveal{border:1px dashed rgba(166,58,43,.5);background:rgba(166,58,43,.08);border-radius:12px;padding:12px;margin-top:12px;}
textarea{width:100%;min-height:86px;border-radius:12px;border:1px solid var(--line);background:#100E0B;color:var(--ink);padding:10px;font-family:inherit;font-size:14px;}
.compliance{font-size:11px;color:#6B5F45;margin-top:12px;} footer{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
.asks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:12px;}
.ask{border:1px solid var(--line);background:#1F1C16;border-radius:12px;padding:10px;cursor:pointer;} .ask:hover{border-color:rgba(233,200,120,.45);} .ask.on{border-color:var(--cinnabar);background:#241E19;box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);} .ask b{display:block;color:#F0E6C8;font-size:14px;} .ask .q{color:#C4B183;font-size:12px;margin-top:4px;}
.bd{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10px;margin-bottom:5px;} .bd.orig{background:var(--cinnabar);color:#F5EFE2;} .bd.der{background:var(--navy);color:#DCE8F2;}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
/* ---- 盘上留痕与一占多断并置层（2026-09-20）----
   取证不再只是"点对领提示"：命中处标序号、连线成"占到断"的路径、盘下生成证据签；
   切换占问方向时，上一方向的痕迹以淡色虚线留在盘上，并给一行"两方向各点亮了哪些格"的对照。
   纪律：痕迹只画在**已登记 SURFACES 对应的格**上；并置层只显示位置，不给任何结论。 */
.tlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.tline{fill:none;stroke:#F0D98C;stroke-width:.7;stroke-dasharray:2 1.4;opacity:.55;}
.gline{fill:none;stroke:#8A7B5C;stroke-width:.6;stroke-dasharray:1.6 1.6;opacity:.5;}
/* 格局层（C3）：三传三支都取到才闭合；青色实线以区别于"取证先后"的金色虚线 */
.pline{fill:rgba(127,166,154,.10);stroke:#7FA69A;stroke-width:.85;opacity:.85;}
.gong.traced{border-color:rgba(240,217,140,.8);box-shadow:0 0 0 1px rgba(240,217,140,.35);}
.gong.ghost{border-style:dashed;border-color:rgba(138,123,92,.65);}
.gong .tnum{position:absolute;top:-7px;left:-7px;width:17px;height:17px;line-height:17px;text-align:center;background:var(--gold);color:#1A1410;border-radius:999px;font-size:10px;font-weight:700;}
.gong.ghost .tnum{background:#8A7B5C;color:#14120F;}
.traces{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tchip{border:1px solid rgba(240,217,140,.35);background:rgba(240,217,140,.10);color:#E6DFD0;border-radius:999px;padding:4px 9px;font-size:11px;}
.tchip.ghost{border-style:dashed;border-color:rgba(138,123,92,.6);background:transparent;color:#9c8f74;}
.tsub{width:100%;color:var(--dim);font-size:11px;margin-top:6px;}
.tsep{width:100%;height:1px;background:var(--line);margin:8px 0 2px;}
/* ---- 偶遇实盘（encounter）视图（2026-09-21）----
   一类「无占类、无可抓用神」的占法：路上见人、车中偶遇、心动一瞥。
   与古籍案例同盘、同锚点口径，但读法不同：不取用神、不判吉凶、末传即心念落点。
   故本视图只做三件事：记「触机」（为什么起这一课）、点「取象」（现场细节↔盘面锚点）、
   写「不取」（看见但决定不取的部分，本类必须明列）。
   见 大六壬文档/案例剧情/偶遇之占-体例与首个实盘.md */
.oyu-pick{margin-top:10px;}
.oyu-btn{display:block;width:100%;text-align:left;border:1px dashed rgba(166,58,43,.5);background:rgba(166,58,43,.07);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;color:#E9D2C9;font-size:13px;}
.oyu-btn:hover{border-color:var(--cinnabar);}
.oyu-btn.on{border-style:solid;border-color:var(--cinnabar);background:rgba(166,58,43,.14);}
.oyu-btn small{display:block;color:var(--dim);margin-top:3px;}
.oyu-mark{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10px;background:var(--cinnabar);color:#F5EFE2;margin-bottom:5px;}
.ouyu{border:1px solid rgba(166,58,43,.28);background:rgba(166,58,43,.05);border-radius:12px;padding:12px;margin-top:12px;}
.ouyu .otitle{color:#F0E6C8;font-weight:700;font-size:14px;}
.ouyu .oline{color:#C4B183;font-size:12px;margin-top:4px;}
.ouyu .oscene{margin:8px 0 0 16px;color:#C4B183;font-size:12px;}
.oyu-chain{margin-top:8px;display:grid;gap:6px;}
.oyu-link{border:1px solid var(--line);background:#211E18;border-radius:10px;padding:8px 10px;font-size:12px;color:#C4B183;}
.oyu-link .ask{color:#F0E6C8;font-size:13px;}
.oyu-link .site{color:var(--dim);}
.oyu-link.found{border-color:rgba(63,122,112,.7);background:rgba(63,122,112,.14);color:#DFF3EA;}
.oyu-link.next{border-color:rgba(240,217,140,.45);}
.oyu-link .hit{margin-top:6px;color:#DFF3EA;white-space:pre-line;}
/* 断语要能"斩钉截铁"，依据要能"随时查证" —— 二者分层，不混在同一段里：
   正文（.hit）只写人话与行话；依据／前提收进 <details>，默认收起。
   这样既不牺牲观感，也不丢可追溯性（合规要的是"能查"，不是"每句都念一遍"）。 */
.oyu-link details{margin-top:6px;}
.oyu-link summary{cursor:pointer;color:var(--dim);font-size:11px;list-style:none;}
.oyu-link summary::-webkit-details-marker{display:none;}
.oyu-link summary::before{content:'▸ ';color:var(--gold-d);}
.oyu-link details[open] summary::before{content:'▾ ';}
.oyu-link .cite{margin-top:4px;color:var(--gold-d);font-size:11px;}
.oyu-link .premise{margin-top:3px;font-size:11px;color:#C4B183;}
.oyu-sign{width:100%;color:var(--dim);font-size:11px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px;}
.lvl{display:inline-block;border-radius:6px;padding:0 5px;font-size:10px;margin-right:5px;background:#3E5C76;color:#F5EFE2;}
.lvl.L1{background:var(--green);}
.lvl.L2{background:var(--navy);}
.lvl.L3{background:#8A7B5C;}
.oyu-refuse{border:1px solid rgba(166,58,43,.35);background:rgba(166,58,43,.06);border-radius:10px;padding:10px;margin-top:12px;}
.oyu-refuse b{color:#E9D2C9;font-size:12px;display:block;}
.oyu-refuse .why{color:#C4B183;font-size:12px;margin-top:3px;}
.oyu-done{border:1px dashed rgba(240,217,140,.5);background:rgba(240,217,140,.07);border-radius:10px;padding:10px;margin-top:10px;}
.oyu-done .ot{color:var(--gold);font-weight:700;font-size:13px;}
/* ---- 偶占「一闪」效果集（2026-09-21）----
   偶占起于"忽然心里一动"，盘面要立刻把这份"动"显出来。三层：
     ① 盘心微光一动（盘盒加 .flash，金色脉动一次，1.1s）
     ② 当下之象抬头 —— 初传那一格加大（.mini.key .z、.gong.key .tian）
     ③ 四课三传整体提亮一档（.pan.flash 下字号上抬）
   纪律：**只动体量与亮度，不动配色、不改盘面事实**（专文 §5.3：盘内一律是同一张传统盘）。 */
@keyframes oyu-flash{from{box-shadow:inset 0 0 0 1px rgba(233,200,120,.08),0 0 0 0 rgba(240,217,140,0);}
 35%{box-shadow:inset 0 0 0 1px rgba(240,217,140,.5),0 0 44px 8px rgba(240,217,140,.24);}
 to{box-shadow:inset 0 0 0 1px rgba(233,200,120,.08),0 0 0 0 rgba(240,217,140,0);}}
.pan.oyu-flash{animation:oyu-flash 1.1s ease-out 1;}
/* ② 当下之象：初传（三传卡片 + 盘上那一格）抬头 */
.mini.key{border-color:rgba(240,217,140,.75);background:#26221A;box-shadow:0 0 0 1px rgba(240,217,140,.22);}
.mini.key .z{font-size:30px;}
.mini.key .t{color:var(--gold);}
.gong.key{border-color:rgba(240,217,140,.75);box-shadow:0 0 0 1px rgba(240,217,140,.25);}
.gong.key .tian{font-size:26px;}
/* ③ 提亮一档：四课三传字号、乘将与地支颜色各深一度（不动背景与主题令牌） */
.pan.oyu-flash .mini .z{font-size:26px;}
.pan.oyu-flash .chuans .mini .z,.pan.oyu-flash .kegs .mini .z{font-size:26px;}
.pan.oyu-flash .gong .tian{font-size:23px;}
/* 起盘所因（现场类型）选择：与左侧占类 chips 同形制，但语义是"这次为什么起"，不是显示偏好。
   它只收窄引导范围 —— 盘面配色一字不动（详见专文 §7 与讨论记录）。 */
.oyu-types{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.oyu-types .chip{font-size:12px;}
.oyu-types .chip.on{background:var(--cinnabar);color:#F5EFE2;border-color:var(--cinnabar);}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>壬案推演原型</h1><div class="sub">一局多占版（古籍案例） ＋ 偶遇实盘版（触机取象）</div></div><span class="badge">网页版原型 · 传统文化研习参考 · 不构成现实判断</span></header>
<div class="grid">
<aside class="card"><h2>案例库</h2><div class="muted">古籍案例与偶遇实盘并列；占类标签可筛，也可搜索</div><input id="caseSearch" class="case-search" type="search" placeholder="搜占类 / 日干支 / 书名…" autocomplete="off"><div class="chips" id="topicChips"></div><div id="caseList"></div></aside>
<main class="layout">
<section class="card"><h2>卷宗与推演</h2><div id="briefBox" class="brief">左侧选一案（古籍案例或偶遇实盘），这里出卷宗与占问方向。</div><div class="asks" id="askBox"></div><div class="toolbar"><button class="btn" id="startBtn">起盘窥天</button><button class="btn ghost" id="thinkBtn" disabled>沉思</button><button class="btn ghost" id="restartBtn" disabled>重开此案</button></div><div id="clueBox" class="clue-list"></div><div id="logBox" class="log"></div><div id="judgeBox" style="margin-top:12px;"></div><div id="revealBox"></div><div class="compliance">本原型仅作传统文化研习与推理练习；剧情与取象内容不用于现实疾病、官讼、投资、气象等判断。</div></section>
<section class="card"><h2>推演盘</h2><div class="muted" id="caseMeta">未起盘</div><div class="facts" id="factBox"></div><div id="methodBox"></div><div class="chuans" id="chuanBox" style="margin-top:10px;"></div><div class="kegs" id="kegBox"></div><div class="pan" id="panBox"></div><div class="traces" id="traceBar"></div><div class="muted" id="traceDiff" style="margin-top:6px;"></div><div id="ouyuBox"></div></section>
<!-- 「证据与规则」整块默认隐藏：**未选案例时它没有内容可显示**，留着只是让用户看一句
     "请选择案例"加一行免责，纯占位。选了案例（或偶占）才由 renderReasons() 放出来。
     免责也不在这里常驻 —— 按"免责挂一次"的口径，落到卷宗区与偶占卡各一次。 -->
<section class="card paper" id="reasonCard" style="grid-column:1/-1;display:none;"><h2>证据与规则 <button class="chip" id="reasonToggle" style="margin-left:8px;">展开</button></h2><div id="noticeBox"></div><div id="reasonBox" style="display:none"></div></section>
</main>
</div>
<footer>LargeLiuRen-Design · UI prototype</footer>
</div>

<script>
LiurenCore.init({duxiang:window.DUXIANG_RULES,shensha:window.SHENSHA_RULES,bifa:window.BIFA,xingnian:window.XN_SCORE});
const CASES=window.ANCIENT_CASES||[];
const STORY=window.CASE_STORY||{};
const ROLE_LABEL={main:'主断',support:'旁证',timing:'应期',risk:'风险',cross:'参证'};
const KEYWORDS=['行人','疾病','官讼','来意','失物','赴任','仕宦','生产','应试','流年','风水','复任','补官','役事','省试','会试'];
const DEFAULT_ENDINGS=['藏机','窥豹','得梗','贯通'];
/* SURFACES：登记全部「可点位」（label + 候选锚点）。先登记后挂事件，

let SURFACES=[];
let topic='全部',cur=null,chart=null,started=false,askIdx=0,found={},thinkIdx=0,submitted=false;
/* 偶遇实盘（encounter）状态 —— 与古籍案例并列、互斥：
     oyuCur=当前实盘 / oyuFound=已取到的取象链 id / OUYU_SURFACES=可点位（登记制，与 SURFACES 同纪律）
   它与案例模式的差别只在"读法"：不取用神、不判吉凶、末传即心念落点。
   盘面一律现场复算（LiurenCore.buildChart），数据文件里一行盘面都不存。 */
let oyuCur=null,oyuFound={},OUYU_SURFACES=[];
/* 事实栏候选（旬空等）单独累积：renderFacts 在渲染早期就会 push，
   而 OUYU_SURFACES 在渲染末尾统一重建（见 renderChartOuyu 收口处），
   两者若共用一个数组，早期的 push 会被重建覆盖 —— 取象链就会有一条永远点不亮。 */
let OUYU_FACT_SURFACES=[];
/* 现场类型（见人／见物／见象／心动／说不好）：**只决定问哪些问题，不预设答案**。
   对应案例侧的"选占问方向"；不改盘面、不落库、不进数据文件。
   纪律：类型只用来筛选引导清单，**绝不能**用来给结论式暗示（那等于把占类偷偷塞回来）。 */
let oyuSceneType='';
/* 「一闪」效果集开关：只改体量与亮度（见 CSS oyu-flash 段），不改配色、不改盘面事实。 */
let oyuFlash=false;
function oyuToggleFlash(){oyuFlash=!oyuFlash;renderAll();if(oyuFlash)setTimeout(function(){$('panBox').classList.add('oyu-flash');},30);}
function oyuInitFlash(){const b=$('oyuFlashBtn');if(b)b.onclick=oyuToggleFlash;const p=$('panBox');if(p&&p.classList)p.classList.remove('oyu-flash');}
/* 取象链命中候选 = 锚点(DOM 位置与匹配口径两用) + clueId（锚点里不含线索 id）。
   锚点 key 与 OUYU_SURFACES 的 JSON.stringify 口径必须一致，否则永远点不中。 */
function anOf(a,id){return {kind:a.kind,ref:a.ref,pos:a.pos,clueId:id};}
function oyuAnchors(){
  const out=[];
  if(oyuCur)oyuCur.lanes.forEach(L=>(L.chain||[]).forEach(k=>(k.anchors||[]).forEach(a=>out.push(a))));
  return out;
}
/* 盘上留痕：trace = 当前方向的证据痕迹（只记"落在哪一格 + 该线索的问句"，不记结论）；
   ghost = 上一方向的痕迹快照，用于「一占多断」的并置对照。二者都不参与 found 判定，
   故切换支线时 found 照样清空（无头反验断言这一点）。 */
let trace=[],ghost=null;
/* 十二宫在盘上的角度（度）——留痕连线与格位共用同一套坐标，避免两处漂移 */
const PAN_ANGLE={午:-90,未:-60,申:-30,酉:0,戌:30,亥:60,子:90,丑:120,寅:150,卯:180,辰:210,巳:240};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function surface(label,cands){SURFACES.push({label:label,cands:cands});return SURFACES.length-1;}
/* 测试钩子：暴露可点位与运行状态，供 _tests/_test_case_story_web.js 无头反验
   （顶层 let 绑定不挂到 window 上，故用函数暴露） */
function protoSurfaces(){return SURFACES;}
function protoState(){const a=askOf();return {caseId:cur?cur.id:'',started:started,askIdx:askIdx,submitted:submitted,found:Object.keys(found),clueTotal:a?a.clues.length:0,hasChart:!!chart,traced:trace.length,tracedCells:traceCellsOrdered(),ghostCells:ghostCells(),patternCells:patternCells(),topic:topic,search:searchText,shown:filterCases().length,total:CASES.length,topics:allTopics()};}
function storyOf(c){return c?STORY[c.id]||null:null;}
/* 无头反验用的筛选入口（与页面上的点击同一条路径） */
function setTopic(t){topic=t;renderTopics();renderList();}
function setSearch(s){searchText=s;const el=$('caseSearch');if(el)el.value=s;renderList();}
/* 占类标签**从数据生成**，不再手写死表 ——
   死表的毛病：① 会留下数据里根本没有的标签（`六甲` 命中 0 条），点了必然空，看着像"筛选坏了"；
   ② 数据里新出现的占类不在表里，用户根本点不到。核对见 _tools/_chk_tags.py。
   计数一并带上：45 案撒在 20+ 个占类上，不给数字就分不清"筛出来了"和"没反应"。 */
function allTopics(){
  const n={};
  CASES.forEach(c=>(c.topics||[]).forEach(t=>{n[t]=(n[t]||0)+1;}));
  return Object.keys(n).sort((a,b)=>n[b]-n[a]||(a<b?-1:a>b?1:0)).map(t=>({t:t,n:n[t]}));
}
function storyCount(){return CASES.filter(c=>!!storyOf(c)).length;}
let searchText='';
function asksOf(c){const st=storyOf(c);return st&&st.asks?st.asks:[];}
function askOf(){const a=asksOf(cur);return a.length?a[Math.min(askIdx,a.length-1)]:null;}
function groupOf(c){if((c.source||'').indexOf('中黄五变经')>=0)return '中黄五变经';if((c.source||'').indexOf('六壬断案')>=0||(c.id||'').indexOf('duanan_')>=0)return '六壬断案';if((c.id||'').indexOf('_yichou_')>=0||(c.title||'').indexOf('乙丑日')>=0||c.chapter==='乙丑日')return '壬占汇选·乙丑日';if((c.id||'').indexOf('_bingyin_')>=0||(c.title||'').indexOf('丙寅日')>=0||c.chapter==='丙寅日')return '壬占汇选·丙寅日';if((c.id||'').indexOf('_dingmao_')>=0||(c.title||'').indexOf('丁卯日')>=0||c.chapter==='丁卯日')return '壬占汇选·丁卯日';if((c.id||'').indexOf('_wuchen_')>=0||(c.title||'').indexOf('戊辰日')>=0||c.chapter==='戊辰日')return '壬占汇选·戊辰日';return '壬占汇选·甲子日';}
function groups(){return ['中黄五变经','六壬断案','壬占汇选·甲子日','壬占汇选·乙丑日','壬占汇选·丙寅日','壬占汇选·丁卯日','壬占汇选·戊辰日'];}
function keywordOf(text){for(const w of KEYWORDS){if((text||'').indexOf(w)>=0)return w;}return '';}
function mainReasoning(c){return c.reasoning&&c.reasoning.length?c.reasoning[0]:null;}
function keyMarks(c){const m=mainReasoning(c),out={};if(!m)return out;(m.evidence||[]).forEach(e=>{if(e.key===true&&e.mark)out[e.ref]=e.mark;});return out;}
function zhiOf(z){return chart?LiurenCore.gongOf(chart.tp,z):'';}
function jiangOf(z){return chart?(chart.jiangMap[zhiOf(z)]||''):'';}
function ssList(z){const b=chart&&chart.dx&&chart.dx.shensha?chart.dx.shensha.byZhi:null;const arr=b&&b[z]?b[z]:[];return arr.map(n=>({kind:'shensha',ref:z+'/'+n}));}
/* 占类筛选（标签从数据生成，带条数）＋ 关键词搜索。
   两个筛选条件是**与**关系；任何筛选都必须在列表上方写明"筛出了几条 / 凭什么"，
   否则用户点了标签只看到列表变短，无法判断是筛出来了还是没反应。 */
function topicChipsHtml(){
  const ts=allTopics();
  const oyuN=oyuCases().length;
  const chip=(t,label,n,on)=>`<button class="chip ${on?'on':''}" data-t="${esc(t)}">${esc(label)}${n==null?'':`<span class="cnt">${n}</span>`}</button>`;
  let h=chip('全部','全部',CASES.length+oyuN,topic==='全部');
  /* 两条线并列：古籍案例（有原断）与偶遇实盘（无原断、只取象）。偶占单独一档，
     因为它没有占类 —— 若让它散落到各占类标签下，那些标签的条数就会把两类混算。 */
  if(oyuN)h+=chip('偶占','偶占',oyuN,topic==='偶占');
  h+=chip('剧情','有剧情',storyCount(),topic==='剧情');
  h+=ts.map(x=>chip(x.t,x.t,x.n,topic===x.t)).join('');
  return h;
}
function renderTopics(){
  $('topicChips').innerHTML=topicChipsHtml();
  $('topicChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.t;renderTopics();renderList();});
  const sb=$('caseSearch');
  if(sb&&sb.value!==searchText)sb.value=searchText;
  if(sb&&!sb.oninput)sb.oninput=()=>{searchText=sb.value||'';renderList();};
}
function filterCases(){
  const kw=(searchText||'').trim().toLowerCase();
  return CASES.filter(c=>{
    if(topic==='剧情'){if(!storyOf(c))return false;}
    else if(topic!=='全部'){if((c.topics||[]).indexOf(topic)<0)return false;}
    if(kw){
      const hay=((c.title||'')+' '+(c.id||'')+' '+(c.chapter||'')+' '+((c.topics||[]).join(' '))+' '+(c.source||'')+' '+(c.summary||'')).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  });
}
function renderList(){
  const isOyu=topic==='偶占';
  const list=isOyu?[]:filterCases();
  const kw=(searchText||'').trim();
  const oyuN=oyuCases().length;
  const why=(topic==='全部'?('全部 · 古籍 '+CASES.length+' 案 ＋ 偶占 '+oyuN+' 例')
    :(topic==='偶占'?'偶遇实盘（无占类、无可抓用神，只取象）'
    :(topic==='剧情'?'只看有一局多占剧情的案例':('占类「'+topic+'」'))))+(kw?('＋关键词「'+kw+'」'):'');
  let html=`<div class="list-info">${why}${isOyu?(' · 共 <b>'+oyuN+'</b> 例'):(' · 筛出 <b>'+list.length+'</b> / '+CASES.length+' 案')}</div>`;
  /* 偶占与古籍案例并列展示，但**不混算条数**：偶占单独一档；选具体占类时不出现 */
  if(!isOyu){
    groups().forEach(g=>{const arr=list.filter(c=>groupOf(c)===g);if(!arr.length)return;html+=`<div class="group">${g}<span class="gn">${arr.length}</span></div>`;arr.forEach(c=>{const has=!!storyOf(c);html+=`<div class="case-item ${cur&&cur.id===c.id?'on':''}" data-id="${esc(c.id)}"><b>${esc(c.title)}</b><small>${(c.topics||[]).join(' / ')} · ${esc(c.chapter)}${has?' · <span class="bd orig">剧情</span>':''}</small></div>`;});});
    if(!list.length)html+='<div class="muted">没有符合条件的案例 —— 换个占类，或清空搜索词。</div>';
  }
  if(topic==='全部'||isOyu)html+=oyuPickHtml();
  $('caseList').innerHTML=html;
  $('caseList').querySelectorAll('.case-item').forEach(el=>el.onclick=()=>selectCase(el.dataset.id));
  bindOyuPick();
}
function selectCase(id){oyuCur=null;oyuFound={};OUYU_SURFACES=[];OUYU_FACT_SURFACES=[];cur=CASES.find(c=>c.id===id)||null;chart=null;started=false;askIdx=0;found={};thinkIdx=0;submitted=false;trace=[];ghost=null;if(cur){const inp=cur.input;chart=LiurenCore.buildChartAncient(inp.mj,inp.dg,inp.dz,inp.hour,inp.yearGan||inp.yg||'',inp.yearZhi||inp.yz||'',inp.monthZhi||'');}renderList();renderAll();}
/* ==================== 偶遇实盘（encounter）视图 ====================
   体例：大六壬文档/案例剧情/偶遇之占-体例与首个实盘.md
   与古籍案例共用同一张盘、同一套锚点口径；差别只在读法（不取用神、不判吉凶）。
   数据源：UI/_data/ouyu_cases.js（由 _tools/export_ouyu_web.py 从同名 .json 生成）。 */
function oyuCases(){return window.OUYU_CASES||[];}
function oyuMode(){return !!oyuCur;}
/* 现场类型只在**选中之后**收窄引导范围；未选（''）时列出全部可取之象。 */
function oyuSceneTypes(){return (oyuCur&&oyuCur.sceneTypes)||[];}
function oyuTypeLabel(id){const t=oyuSceneTypes().find(x=>x.id===id);return t?t.label:'';}
/* 「说不好」等价于不限：它的语义就是"把可取之象全列出来" ——
   若按 forTypes 过滤，它就成了一条最窄的路，与自己的说明矛盾。 */
function oyuAllTypes(){return oyuSceneType===''||oyuSceneType==='shuobujhao';}
function oyuLaneVisible(L){if(oyuAllTypes())return true;const f=L.forTypes;return !f||!f.length||f.indexOf(oyuSceneType)>=0;}
function oyuVisibleLanes(){return oyuCur?(oyuCur.lanes||[]).filter(oyuLaneVisible):[];}
function oyuLinks(){const out=[];oyuVisibleLanes().forEach(L=>(L.chain||[]).forEach(k=>out.push(k)));return out;}
function oyuSetSceneType(id){oyuSceneType=id;/* 收窄范围后，已取到的链可能不在新范围内：重置取证（与案例"换占问方向"同纪律） */
  oyuFound={};trace=[];$('logBox').innerHTML='';log('起盘所因：'+(oyuTypeLabel(id)||id)+'。范围已按此收窄——只问这一类该问的问题，不给结论。','good');renderAll();}
function oyuFoundCount(){return oyuLinks().filter(k=>oyuFound[k.id]).length;}
function oyuDone(){const n=oyuLinks().length;return n>0&&oyuFoundCount()===n;}
function anKey(a){return JSON.stringify([a.kind,a.ref||'',a.pos||'']);}
/* 与案例侧 cellOfAnchor 同口径：把锚点落到盘上格（'' = 属"事实栏"，不在盘上） */
function oyuCell(an){return cellOfAnchor(an);}
/* 锚点 → 人话位置（偶占链路文案用，不依赖 cur.input） */
function oyuWhere(an){
  const k=an.kind,ref=String(an.ref||''),head=ref.split('/')[0];
  if(k==='method')return '课名';
  if(k==='chuan')return (an.pos||'')+' '+head;
  if(k==='keg')return '第'+['一','二','三','四'][chart.kegs.findIndex(x=>x.x+'/'+x.s===ref)]+'课 '+ref;
  if(k==='jiang')return head+' 乘 '+ref.split('/')[1];
  if(k==='shensha')return head+' 神煞 '+ref.split('/')[1];
  if(k==='xunkong')return '旬空 '+head;
  if(k==='zhi')return '支 '+head;
  if(k==='gong')return '宫 '+head;
  if(k==='hour')return '占时 '+head;
  if(k==='dayWangShuai')return '日干旺衰 '+head;
  return head;
}
/* 触机记录：偶占最珍贵的是现场，可复算的锚点全靠它。
   偶占列表与古籍案例**共用同一个筛选区**（左侧案例库）：
   选「全部」时两条线并列显示；选「偶占」只看偶占；选具体占类时不显示偶占
   （偶占没有占类，若散到各占类标签下，那些标签的条数就会把两类混算）。 */
function oyuPickHtml(){
  const list=oyuCases();
  if(!list.length)return '';
  return '<div class="group">偶遇实盘 · 触机取象<span class="gn">'+list.length+'</span></div>'
    +'<div class="muted" style="margin-bottom:6px;">无占类、无可抓用神的一类占法：路上见人、车中偶遇、心动一瞥。点进去记「为什么起这一课」，再逐条把现场细节落到盘上。</div>'
    +'<div class="oyu-pick">'+list.map(c=>`<button class="oyu-btn ${oyuCur&&oyuCur.id===c.id?'on':''}" data-id="${esc(c.id)}"><span class="oyu-mark">偶遇实盘</span><b>${esc(c.title)}</b><small>${esc(c.when)} · ${esc(c.place)} · 取象链 ${oyuLinksOf(c).length} 条</small></button>`).join('')+'</div>';
}
function bindOyuPick(){
  const box=$('caseList');if(!box)return;
  box.querySelectorAll('.oyu-btn').forEach(el=>el.onclick=()=>oyuOpen(el.dataset.id));
}
function oyuLinksOf(c){const out=[];(c.lanes||[]).forEach(L=>(L.chain||[]).forEach(k=>out.push(k)));return out;}
function oyuOpen(id){
  const c=oyuCases().find(x=>x.id===id);if(!c)return;
  cur=null;found={};trace=[];ghost=null;submitted=false;askIdx=0;thinkIdx=0;
  oyuCur=c;oyuFound={};OUYU_SURFACES=[];OUYU_FACT_SURFACES=[];oyuSceneType='';
  chart=LiurenCore.buildChart({date:c.date,hourZhi:c.hour,calData:window.CAL,yjAll:window.YJ_ALL})||null;
  started=!!chart;
  $('logBox').innerHTML='';
  if(!chart){log('该实盘无法复算：'+c.date+' '+c.hour+'时（检查日期是否在历法表内、占时是否为十二支）。','bad');}
  else{log('触机立课：'+c.when+'『'+c.why+'』。偶遇之占不设占类、不判吉凶——初传即当下，末传即心念落点。','good');}
  renderAll();
}
/* 点盘/点卡片：先在偶占的可点位里找，命中即记一条取象链 */
function tryOuyuPick(cands,label){
  if(!oyuCur||!started)return false;
  const arr=Array.isArray(cands)?cands:[cands];
  const keys=arr.map(cd=>anKey(cd));
  const links=oyuLinks();
  /* 同一个锚点可以属多条取象链（例：初传卯同属「L1 事实层」与「当下正在发生什么」）。
     若直接 find 第一条匹配，后面的链**永远轮不上**（穷举也点不亮）。
     故优先落到「尚未取到」的链上；都已取到则回落到首条匹配（用于"已取过"的回执）。 */
  const hit=k=>(k.anchors||[]).some(a=>keys.indexOf(anKey(a))>=0);
  const link=links.find(k=>!oyuFound[k.id]&&hit(k))||links.find(hit);
  if(!link){log('这一处不在本次触机的取象链上。偶遇之占只取与现场细节对得上的那几处——别的都可以不取。','bad');return false;}
  if(oyuFound[link.id]){log('这一条已取过了：'+link.onSite,'');return true;}
  oyuFound[link.id]=true;
  tracePush({id:link.id,label:link.onSite},link.anchors,label);
  log('取象既得：'+link.onSite+' → '+link.hint,'good');
  if(oyuDone())log('取象链已集齐。末传即心念落点——「她是谁」本课不回答，本课回答的是「这一眼停在哪个象上」。','good');
  renderAll();return true;
}
function oyuReset(){
  oyuFound={};trace=[];$('logBox').innerHTML='';log('重开此实盘：取象链已清，盘面与触机记录保留。','good');renderAll();
}
function renderOuyu(){
  const box=$('ouyuBox');if(!box)return;
