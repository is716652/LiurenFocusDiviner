<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壬案推演原型 · 古籍案例剧情化研读</title>
<style>
:root{
  --bg:#14120F; --panel:#1C1A16; --panel2:#24211A; --paper:#F5EFE2; --ink:#E6DFD0;
  --gold:#F0D98C; --gold-d:#A8843C; --dim:#8A7B5C; --line:rgba(233,200,120,.18);
  --cinnabar:#A63A2B; --navy:#2F4A5F; --green:#3F7A70; --risk:#7A2E2E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(circle at 50% 0%, #1d1913, var(--bg));color:var(--ink);font-family:"HarmonyOS Sans","Microsoft YaHei",sans-serif;line-height:1.7;}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
header{padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;}
h1{color:var(--gold);font-size:28px;letter-spacing:5px;}
.sub{color:var(--dim);font-size:13px;margin-top:4px;}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--gold-d);font-size:12px;}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;}
@media(max-width:920px){.grid{grid-template-columns:1fr;}}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);}
.card.paper{background:linear-gradient(160deg,#F7F1E0,#EFE3C8);color:#2B241B;border-color:rgba(166,58,43,.25);}
.card h2{color:var(--gold);font-size:18px;margin-bottom:8px;letter-spacing:2px;}
.card.paper h2{color:var(--cinnabar);}
.muted{color:var(--dim);font-size:12px;}
.paper .muted{color:#6A5F4B;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;}
.chip{border:1px solid var(--line);background:#211E18;color:#C4B183;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;}
.chip.on{background:#E9C878;color:#1A1410;font-weight:700;}
.group{color:var(--gold-d);font-size:12px;margin:12px 0 6px;letter-spacing:1px;}
.case-item{border:1px solid var(--line);background:#1C1A16;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;}
.case-item:hover{border-color:rgba(233,200,120,.45);}
.case-item.on{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,43,.55);}
.case-item b{display:block;color:#F0E6C8;font-size:14px;}
.case-item small{color:var(--dim);display:block;margin-top:3px;}
.story{font-size:16px;line-height:2;}
.story .speak{background:rgba(240,217,140,.08);border-left:3px solid var(--gold-d);padding:10px 12px;border-radius:8px;margin:10px 0;}
.btn{background:linear-gradient(135deg,#8a6a1e,var(--gold-d));border:none;color:#14100A;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;letter-spacing:1px;}
.btn.ghost{background:#211E18;color:#C4B183;border:1px solid var(--line);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px;}
.ans{border:1px solid var(--line);background:#211E18;color:#E6DFD0;border-radius:12px;padding:10px;text-align:left;cursor:pointer;}
.ans:hover{border-color:var(--gold-d);}
.ans.right{border-color:var(--green);background:rgba(63,122,112,.22);}
.ans.wrong{border-color:var(--risk);background:rgba(122,46,46,.20);}
.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start;}
@media(max-width:1100px){.layout{grid-template-columns:1fr;}}
.pan{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.gong{background:#211E18;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;min-height:78px;}
.gong .di{color:var(--dim);font-size:11px;}
.gong .tian{color:var(--gold);font-size:20px;font-weight:700;}
.gong .jiang{color:#C4B183;font-size:11px;}
.gong.focus{border-color:var(--cinnabar);box-shadow:0 0 0 1px rgba(166,58,43,.5);}
.kegs,.chuans{display:grid;gap:8px;margin-top:10px;}
.kegs{grid-template-columns:repeat(4,1fr);}
.chuans{grid-template-columns:repeat(3,1fr);}
.mini{background:#211E18;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;position:relative;}
.mini .t{font-size:11px;color:var(--dim);}
.mini .z{font-size:22px;font-weight:800;color:var(--gold);}
.mini .j{font-size:11px;color:#C4B183;}
.mark{position:absolute;top:6px;right:6px;background:var(--cinnabar);color:#F5EFE2;border-radius:7px;padding:1px 5px;font-size:10px;}
.role{display:inline-block;border-radius:8px;color:#F5EFE2;padding:2px 6px;font-size:10px;margin-right:6px;}
.role.main{background:var(--cinnabar);} .role.support{background:#8A7B5C;} .role.timing{background:var(--navy);} .role.risk{background:var(--risk);} .role.cross{background:#3E5C76;}
.reason{border-top:1px solid rgba(166,58,43,.15);padding:8px 0;}
.reason.main{background:rgba(166,58,43,.08);border:1px solid rgba(166,58,43,.22);border-radius:10px;padding:10px;}
.reason .claim{font-weight:700;color:#2B241B;}
.paper .reason .ev{color:#4A3F32;font-size:12px;}
.notice{border-radius:10px;padding:8px 10px;font-size:12px;margin:8px 0;}
.notice.same{color:var(--navy);background:rgba(47,74,95,.12);}
.notice.diff{color:var(--risk);background:rgba(122,46,46,.10);}
.reveal{border:1px dashed rgba(166,58,43,.5);background:rgba(166,58,43,.08);border-radius:12px;padding:12px;margin-top:12px;}
.compliance{font-size:11px;color:#6B5F45;margin-top:12px;}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>壬案推演原型</h1>
    <div class="sub">把古案例做成剧情：先排盘、抓用神、选断点，再揭示古人断语</div>
  </div>
  <span class="badge">网页版原型 · 古籍研习参考 · 不构成现实判断</span>
</header>

<div class="grid">
  <aside class="card">
    <h2>案例库</h2>
    <div class="muted">已同步 APP 案例数据：分组 + 占类筛选</div>
    <div class="chips" id="topicChips"></div>
    <div id="caseList"></div>
  </aside>

  <main class="layout">
    <section class="card">
      <h2>剧情推演</h2>
      <div id="storyBox" class="story"></div>
      <div id="answerBox" class="answers"></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
        <button class="btn ghost" id="prevBtn">上一步</button>
        <button class="btn" id="nextBtn">下一步</button>
        <button class="btn ghost" id="revealBtn">揭示古断</button>
      </div>
      <div id="revealBox"></div>
    </section>

    <section class="card">
      <h2>推演盘</h2>
      <div class="muted" id="caseMeta">请选择案例</div>
      <div class="pan" id="panBox" style="margin-top:10px;"></div>
      <div class="kegs" id="kegBox"></div>
      <div class="chuans" id="chuanBox"></div>
    </section>

    <section class="card paper" style="grid-column:1/-1;">
      <h2>断语证据链</h2>
      <div id="noticeBox"></div>
      <div id="reasonBox"></div>
      <div class="compliance">本原型仅作传统文化研习与推理练习；剧情内容不用于现实疾病、官讼、投资等判断。</div>
    </section>
  </main>
</div>
<footer>LargeLiuRen-Design · UI prototype</footer>
</div>

<script src="_data/duxiang_rules.js"></script>
<script src="_data/duxiang_leixiang.js"></script>
<script src="_data/shensha_rules.js"></script>
<script src="_data/bifa.js"></script>
<script src="_data/bifa_coach.js"></script>
<script src="_data/xingnian_score.js"></script>
<script src="../core/liuren-core.js?v=20260827-story"></script>
<script src="_data/ancient_case_gallery.js?v=20260827-story"></script>
<script>
LiurenCore.init({duxiang: window.DUXIANG_RULES, shensha: window.SHENSHA_RULES, bifa: window.BIFA, xingnian: window.XN_SCORE});
const CASES = window.ANCIENT_CASES || [];
const TOPICS = ['全部','来意','疾病','官讼','行人','仕宦','生产','风水','应候','役事','终身','省试','会试','流年','前程','己身','复建','亡盗','远行','索债','赴任','复任','补官','六甲'];
const ROLE_LABEL = {main:'主断', support:'旁证', timing:'应期', risk:'风险', cross:'参证'};
const KEYWORDS = ['行人','疾病','官讼','来意','失物','赴任','仕宦','生产','应试','流年','风水','复任','补官','役事','省试','会试'];
let topic = '全部';
let cur = null;
let chart = null;
let step = 0;
let answers = {};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s); }
function groupOf(c){
  if((c.source||'').indexOf('中黄五变经') >= 0) return '中黄五变经';
  if((c.id||'').indexOf('_yichou_') >= 0 || (c.title||'').indexOf('乙丑日') >= 0 || c.chapter === '乙丑日') return '壬占汇选·乙丑日';
  if((c.id||'').indexOf('_bingyin_') >= 0 || (c.title||'').indexOf('丙寅日') >= 0 || c.chapter === '丙寅日') return '壬占汇选·丙寅日';
  return '壬占汇选·甲子日';
}
function groups(){ return ['中黄五变经','壬占汇选·甲子日','壬占汇选·乙丑日','壬占汇选·丙寅日']; }
function keywordOf(text){
  for(const w of KEYWORDS){ if((text||'').indexOf(w) >= 0) return w; }
  return '';
}
function mainReasoning(c){ return c.reasoning && c.reasoning.length ? c.reasoning[0] : null; }
function keyMarks(c){
  const m = mainReasoning(c); const out = {};
  if(!m) return out;
  (m.evidence||[]).forEach(e=>{
    if(e.key === true && e.mark){ out[e.ref] = e.mark; }
  });
  return out;
}
function renderTopics(){
  $('topicChips').innerHTML = TOPICS.map(t=>`<button class="chip ${topic===t?'on':''}" data-t="${t}">${t}</button>`).join('');
  $('topicChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ topic=b.dataset.t; renderTopics(); renderList(); });
}
function renderList(){
  const list = CASES.filter(c=> topic==='全部' || (c.topics||[]).indexOf(topic) >= 0);
  let html = '';
  groups().forEach(g=>{
    const arr = list.filter(c=>groupOf(c)===g);
    if(!arr.length) return;
    html += `<div class="group">${g}</div>`;
    arr.forEach(c=>{
      html += `<div class="case-item ${cur && cur.id===c.id?'on':''}" data-id="${c.id}"><b>${c.title}</b><small>${(c.topics||[]).join(' / ')} · ${c.chapter}</small></div>`;
    });
  });
  $('caseList').innerHTML = html || '<div class="muted">此占类暂无案例</div>';
  $('caseList').querySelectorAll('.case-item').forEach(el=>el.onclick=()=>selectCase(el.dataset.id));
}
function selectCase(id){
  cur = CASES.find(c=>c.id===id) || null;
  step = 0; answers = {};
  if(!cur) return;
  const inp = cur.input;
  chart = LiurenCore.buildChartAncient(inp.mj, inp.dg, inp.dz, inp.hour, inp.yg || '', inp.yz || '', inp.monthZhi || '');
  renderList(); renderAll();
}
function storyScenes(c){
  if(c && c.id === 'renzhan_jiazi_011_xue_xingren'){
    return [
      {t:'story', text:'十月甲子日，卯将子时。有贵人占从人到否。雪心曰：先看其人已动未动，再看归程迟速。'},
      {t:'ask', key:'yongshen', q:'行人一事，你先抓哪一点为用？', options:[{v:'寅',label:'寅 · 末传'}, {v:'申',label:'申 · 初传'}, {v:'亥',label:'亥 · 中传'}, {v:'子',label:'子 · 占时'}], right:'寅', why:'此课末传寅为马，行人链条宜抓马动。'},
      {t:'ask', key:'gui', q:'主“归”的断点落在哪一传？', options:[{v:'初传申',label:'初传申'}, {v:'中传亥',label:'中传亥'}, {v:'末传寅',label:'末传寅'}], right:'末传寅', why:'末传寅为马，马动主归。'},
      {t:'ask', key:'late', q:'既主归，为何又迟？', options:[{v:'中传亥空',label:'中传亥空'}, {v:'初传申生',label:'初传申生'}, {v:'伏吟不动',label:'伏吟不动'}], right:'中传亥空', why:'中传亥空，中途有名无实，故来而迟。'},
      {t:'reveal', text:'雪心原断：主来而迟。后至亥月，丁亥日自川中来。'}
    ];
  }
  return [
    {t:'story', text:'此案暂未写剧情脚本。可先读盘、看主断链，再对照证据链。'},
    {t:'reveal', text:'揭示原案断语与证据链。'}
  ];
}
function renderStory(){
  const box = $('storyBox'); const ab = $('answerBox');
  if(!cur){ box.innerHTML = '<div class="muted">从左侧选择「雪心占行人」可体验完整剧情原型；其他案例先看盘与证据链。</div>'; ab.innerHTML=''; return; }
  const scenes = storyScenes(cur);
  const s = scenes[Math.min(step, scenes.length-1)];
  if(s.t === 'story' || s.t === 'reveal'){
    box.innerHTML = `<div class="speak">${s.text}</div>`;
    ab.innerHTML = '';
  } else {
    const ans = answers[s.key];
    box.innerHTML = `<div class="speak">${s.q}</div>`;
    ab.innerHTML = s.options.map(o=>{
      let cls = 'ans';
      if(ans){ if(o.v === s.right) cls += ' right'; else if(o.v === ans) cls += ' wrong'; }
      return `<button class="${cls}" data-k="${s.key}" data-v="${o.v}">${o.label}</button>`;
    }).join('');
    ab.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
      answers[b.dataset.k] = b.dataset.v;
      renderStory();
    });
    if(ans){
      box.innerHTML += `<div class="notice ${ans===s.right?'same':'diff'}">${ans===s.right?'已抓住要点：':'此点还不是主断：'}${s.why}</div>`;
    }
  }
  $('prevBtn').disabled = step <= 0;
  $('nextBtn').disabled = !cur || step >= storyScenes(cur).length - 1;
}
function renderChart(){
  if(!cur || !chart){ $('caseMeta').textContent='请选择案例'; $('panBox').innerHTML=''; $('kegBox').innerHTML=''; $('chuanBox').innerHTML=''; return; }
  const marks = keyMarks(cur);
  $('caseMeta').textContent = cur.title + ' · ' + cur.input.mj + '将 ' + cur.input.dg + cur.input.dz + '日 ' + cur.input.hour + '时 · 旬空' + (chart.dx.xunkong.length ? chart.dx.xunkong.join('') : '无');
  $('panBox').innerHTML = LiurenCore.ZHI.map(z=>{
    const g = LiurenCore.gongOf(chart.tp, z);
    const j = chart.jiangMap[g] || '';
    const focus = marks[z] ? ' focus' : '';
    return `<div class="gong${focus}">${marks[z]?`<span class="mark">${marks[z]}</span>`:''}<div class="di">地盘 ${g}</div><div class="tian">${z}</div><div class="jiang">${j}</div></div>`;
  }).join('');
  $('kegBox').innerHTML = chart.kegs.map((k,i)=>`<div class="mini"><div class="t">第${['一','二','三','四'][i]}课</div><div class="z">${k.x}/${k.s}</div><div class="j">${chart.jiangMap[LiurenCore.gongOf(chart.tp,k.x)]||''}</div></div>`).join('');
  $('chuanBox').innerHTML = chart.sanchuan.chuans.map((q,i)=>{
    const mk = marks[q.z] ? `<span class="mark">${marks[q.z]}</span>` : '';
    return `<div class="mini">${mk}<div class="t">${['初传','中传','末传'][i]}</div><div class="z">${q.gz}</div><div class="j">${chart.jiangMap[LiurenCore.gongOf(chart.tp,q.z)]||''}</div></div>`;
  }).join('');
}
function renderReasons(){
  const nb = $('noticeBox'); const rb = $('reasonBox');
  if(!cur || !cur.reasoning || !cur.reasoning.length){ nb.innerHTML=''; rb.innerHTML='<div class="muted">此案尚未补证据链。</div>'; return; }
  const mk = keywordOf(mainReasoning(cur).claim);
  const same = mk ? cur.reasoning.filter(r=>r.role!=='main' && (r.claim||'').indexOf(mk) >= 0).length : 0;
  const diff = mk ? cur.reasoning.filter(r=>r.role!=='main' && keywordOf(r.claim) && keywordOf(r.claim)!==mk) : [];
  let nh = '';
  if(same) nh += `<div class="notice same">多链同断：${mk} · 主链外另有 ${same} 条佐证</div>`;
  if(diff.length) nh += `<div class="notice diff">异断对读：主断为「${mk}」，另有 ${diff.length} 条落在其他占类，宜分列参看</div>`;
  nb.innerHTML = nh;
  rb.innerHTML = cur.reasoning.map(r=>{
    const role = r.role || 'support';
    const divergent = diff.some(x=>x.claim===r.claim) ? '<span class="role timing">异断</span>' : '';
    const ev = (r.evidence||[]).map(e=>`<div class="ev">· ${e.why}${e.mark && e.key===true ? ` <b style="color:#A63A2B">[${e.mark}]</b>`:''}</div>`).join('');
    return `<div class="reason ${role==='main'?'main':''}"><span class="role ${role}">${ROLE_LABEL[role]||'旁证'}</span>${divergent}<span class="claim">${r.claim}</span><div class="muted">${r.ruleRef||''}</div>${ev}${r.note?`<div class="muted">${r.note}</div>`:''}</div>`;
  }).join('');
}
function renderReveal(){
  if(!cur){ $('revealBox').innerHTML=''; return; }
  $('revealBox').innerHTML = `<div class="reveal"><b style="color:#F0D98C">古断揭示</b><div style="margin-top:6px;">${cur.original}</div><div class="muted" style="margin-top:8px;">${cur.summary}</div></div>`;
}
function renderAll(){ renderStory(); renderChart(); renderReasons(); $('revealBox').innerHTML=''; }
$('prevBtn').onclick=()=>{ if(step>0){ step--; renderStory(); } };
$('nextBtn').onclick=()=>{ if(cur && step < storyScenes(cur).length-1){ step++; renderStory(); } };
$('revealBtn').onclick=renderReveal;
renderTopics(); renderList(); renderAll();
</script>
</body>
</html>
